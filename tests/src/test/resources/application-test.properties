spring.profiles.active=test

mybatis-flex.configuration.default-fetch-size=1000
mybatis-flex.configuration.local-cache-scope=statement
mybatis-flex.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl
spring.application.name=example
wind.i18n.messages.locales=zh-CN,en-US


wind.security.captcha.group=example
wind.security.captcha.enabled=true
# 手机短信验证码配置
wind.security.captcha.mobile-phone.effective-time=PT5M
wind.security.captcha.mobile-phone.mx-allow-generate-times-of-user-with-day=60
wind.security.captcha.mobile-phone.flow-control.speed=30
# 邮箱验证码配置
wind.security.captcha.email.effective-time=PT15M
wind.security.captcha.email.mx-allow-generate-times-of-user-with-day=60
wind.security.captcha.email.flow-control.speed=50