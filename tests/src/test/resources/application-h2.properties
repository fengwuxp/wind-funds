spring.datasource.username=${WIND_FUNDS_TEST_DATASOURCE_USERNAME:sa}
spring.datasource.password=${WIND_FUNDS_TEST_DATASOURCE_PASSWORD:sa}
spring.datasource.url=${WIND_FUNDS_TEST_DATASOURCE_URL:jdbc:h2:mem:dbtest;MODE=MySQL}
spring.datasource.driver-class-name=${WIND_FUNDS_TEST_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.hikari.maximum-pool-size=30
spring.sql.init.schema-locations=classpath:jdbc-schema.sql
spring.sql.init.mode=${WIND_FUNDS_TEST_SQL_INIT_MODE:embedded}
#spring.sql.init.data-locations=classpath:jdbc-data.sql
spring.sql.init.platform=h2
