<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 960" width="1600" height="960" role="img" aria-labelledby="title desc">
  <title id="title">PRD 核心链路：资金事实到运营闭环</title>
  <desc id="desc">支付资金底座 PRD 视角的核心链路图，展示业务事实、交易接入、钱包账户、资金路由、账本账目、投影视图、清结算对账和差错追加事实闭环。</desc>
  <style>
    text {
      font-family: "Helvetica Neue", Helvetica, Arial, "PingFang SC", "Microsoft YaHei", "Microsoft JhengHei", "SimHei", sans-serif;
      fill: #111827;
    }
    .title { font-size: 28px; font-weight: 700; }
    .subtitle { font-size: 14px; fill: #6b7280; }
    .section-title { font-size: 16px; font-weight: 700; fill: #374151; }
    .node-title { font-size: 16px; font-weight: 700; }
    .node-sub { font-size: 12px; fill: #4b5563; }
    .small { font-size: 12px; fill: #6b7280; }
    .badge-text { font-size: 13px; font-weight: 600; fill: #374151; }
    .container { fill: #ffffff; stroke: #d1d5db; stroke-width: 1.5; stroke-dasharray: 8 7; rx: 18; ry: 18; }
    .node { fill: #ffffff; stroke: #d1d5db; stroke-width: 1.5; rx: 10; ry: 10; }
    .node-blue { fill: #eff6ff; stroke: #bfdbfe; }
    .node-green { fill: #f0fdf4; stroke: #bbf7d0; }
    .node-purple { fill: #faf5ff; stroke: #e9d5ff; }
    .node-orange { fill: #fff7ed; stroke: #fed7aa; }
    .node-red { fill: #fef2f2; stroke: #fecaca; }
    .node-teal { fill: #f0fdfa; stroke: #99f6e4; }
    .arrow-main { stroke: #2563eb; stroke-width: 2.6; fill: none; marker-end: url(#arrow-blue); }
    .arrow-ledger { stroke: #16a34a; stroke-width: 2.6; fill: none; marker-end: url(#arrow-green); }
    .arrow-read { stroke: #9333ea; stroke-width: 2.2; fill: none; marker-end: url(#arrow-purple); }
    .arrow-ops { stroke: #ea580c; stroke-width: 2.5; fill: none; marker-end: url(#arrow-orange); }
    .arrow-risk { stroke: #dc2626; stroke-width: 2.5; fill: none; marker-end: url(#arrow-red); stroke-dasharray: 8 6; }
    .arrow-ext { stroke: #64748b; stroke-width: 2.2; fill: none; marker-end: url(#arrow-gray); stroke-dasharray: 7 6; }
    .label-box { fill: #ffffff; opacity: 0.96; stroke: #e5e7eb; stroke-width: 1; rx: 6; ry: 6; }
  </style>
  <defs>
    <marker id="arrow-blue" markerWidth="12" markerHeight="8" refX="11" refY="4" orient="auto">
      <polygon points="0 0, 12 4, 0 8" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" markerWidth="12" markerHeight="8" refX="11" refY="4" orient="auto">
      <polygon points="0 0, 12 4, 0 8" fill="#16a34a"/>
    </marker>
    <marker id="arrow-purple" markerWidth="12" markerHeight="8" refX="11" refY="4" orient="auto">
      <polygon points="0 0, 12 4, 0 8" fill="#9333ea"/>
    </marker>
    <marker id="arrow-orange" markerWidth="12" markerHeight="8" refX="11" refY="4" orient="auto">
      <polygon points="0 0, 12 4, 0 8" fill="#ea580c"/>
    </marker>
    <marker id="arrow-red" markerWidth="12" markerHeight="8" refX="11" refY="4" orient="auto">
      <polygon points="0 0, 12 4, 0 8" fill="#dc2626"/>
    </marker>
    <marker id="arrow-gray" markerWidth="12" markerHeight="8" refX="11" refY="4" orient="auto">
      <polygon points="0 0, 12 4, 0 8" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="1600" height="960" fill="#ffffff"/>
  <text x="60" y="56" class="title">PRD 核心链路：资金事实到运营闭环</text>
  <text x="60" y="84" class="subtitle">来源：docs/产品设计/01-PRD总览.md、02-交易路由钱包账目与投影.md、03-清结算与对账.md</text>

  <rect x="40" y="125" width="1520" height="210" class="container"/>
  <text x="60" y="158" class="section-title">主写入链路：每一笔金额必须被事实、路径、分录和投影解释</text>

  <rect x="60" y="185" width="180" height="100" class="node node-blue"/>
  <text x="150" y="218" text-anchor="middle" class="node-title">业务事实</text>
  <text x="150" y="243" text-anchor="middle" class="node-sub">入金 / 支付 / 授权</text>
  <text x="150" y="262" text-anchor="middle" class="node-sub">退款 / 冻结 / 调账</text>

  <rect x="280" y="185" width="180" height="100" class="node node-blue"/>
  <text x="370" y="218" text-anchor="middle" class="node-title">交易接入</text>
  <text x="370" y="243" text-anchor="middle" class="node-sub">校验 / 幂等 / 生命周期</text>
  <text x="370" y="262" text-anchor="middle" class="node-sub">请求摘要 / 事实记录</text>

  <rect x="500" y="185" width="180" height="100" class="node node-teal"/>
  <text x="590" y="218" text-anchor="middle" class="node-title">钱包账户</text>
  <text x="590" y="243" text-anchor="middle" class="node-sub">主体 / 账户 / 余额桶</text>
  <text x="590" y="262" text-anchor="middle" class="node-sub">工具引用 / 约束</text>

  <rect x="720" y="185" width="180" height="100" class="node node-blue"/>
  <text x="810" y="218" text-anchor="middle" class="node-title">资金路由</text>
  <text x="810" y="243" text-anchor="middle" class="node-sub">参与方 / 路径</text>
  <text x="810" y="262" text-anchor="middle" class="node-sub">RouteSnapshot</text>

  <rect x="940" y="185" width="180" height="100" class="node node-green"/>
  <text x="1030" y="218" text-anchor="middle" class="node-title">账本账目</text>
  <text x="1030" y="243" text-anchor="middle" class="node-sub">PostingPlan / 平衡校验</text>
  <text x="1030" y="262" text-anchor="middle" class="node-sub">LedgerTransaction / Entry</text>

  <rect x="1160" y="185" width="180" height="100" class="node node-purple"/>
  <text x="1250" y="218" text-anchor="middle" class="node-title">投影视图</text>
  <text x="1250" y="243" text-anchor="middle" class="node-sub">余额投影 / 交易投影</text>
  <text x="1250" y="262" text-anchor="middle" class="node-sub">账单 / 时间线 / 报表输入</text>

  <rect x="1380" y="185" width="160" height="100" class="node node-purple"/>
  <text x="1460" y="218" text-anchor="middle" class="node-title">使用者查询</text>
  <text x="1460" y="243" text-anchor="middle" class="node-sub">用户 / 商户</text>
  <text x="1460" y="262" text-anchor="middle" class="node-sub">运营 / 财务 / 风控</text>

  <path d="M 240 235 L 280 235" class="arrow-main"/>
  <path d="M 460 235 L 500 235" class="arrow-main"/>
  <path d="M 680 235 L 720 235" class="arrow-main"/>
  <path d="M 900 235 L 940 235" class="arrow-ledger"/>
  <path d="M 1120 235 L 1160 235" class="arrow-read"/>
  <path d="M 1340 235 L 1380 235" class="arrow-read"/>

  <rect x="40" y="385" width="1520" height="245" class="container"/>
  <text x="60" y="418" class="section-title">运营闭环：清分、清算、结算、出款和对账差错都只能消费或追加事实</text>

  <rect x="60" y="470" width="180" height="100" class="node"/>
  <text x="150" y="503" text-anchor="middle" class="node-title">外部证据</text>
  <text x="150" y="528" text-anchor="middle" class="node-sub">通道文件 / 银行流水</text>
  <text x="150" y="547" text-anchor="middle" class="node-sub">回单 / 商户账单</text>

  <rect x="280" y="470" width="180" height="100" class="node node-orange"/>
  <text x="370" y="503" text-anchor="middle" class="node-title">可清分识别</text>
  <text x="370" y="528" text-anchor="middle" class="node-sub">成功交易明细</text>
  <text x="370" y="547" text-anchor="middle" class="node-sub">CLEARING 分录</text>

  <rect x="500" y="470" width="180" height="100" class="node node-orange"/>
  <text x="590" y="503" text-anchor="middle" class="node-title">清分批次</text>
  <text x="590" y="528" text-anchor="middle" class="node-sub">主体 / 币种 / 周期</text>
  <text x="590" y="547" text-anchor="middle" class="node-sub">规则版本 / 明细摘要</text>

  <rect x="720" y="470" width="180" height="100" class="node node-orange"/>
  <text x="810" y="503" text-anchor="middle" class="node-title">清算确认</text>
  <text x="810" y="528" text-anchor="middle" class="node-sub">候选锁定 / 复核</text>
  <text x="810" y="547" text-anchor="middle" class="node-sub">CLEARING -> AVAILABLE</text>

  <rect x="940" y="470" width="180" height="100" class="node node-orange"/>
  <text x="1030" y="503" text-anchor="middle" class="node-title">结算与出款</text>
  <text x="1030" y="528" text-anchor="middle" class="node-sub">结算单 / 扣减项</text>
  <text x="1030" y="547" text-anchor="middle" class="node-sub">出款单 / 外部回单</text>

  <rect x="1160" y="470" width="180" height="100" class="node node-red"/>
  <text x="1250" y="503" text-anchor="middle" class="node-title">对账差错</text>
  <text x="1250" y="528" text-anchor="middle" class="node-sub">账实 / 账账 / 单账</text>
  <text x="1250" y="547" text-anchor="middle" class="node-sub">阻断 / 放行 / 核销</text>

  <rect x="1380" y="470" width="160" height="100" class="node node-red"/>
  <text x="1460" y="503" text-anchor="middle" class="node-title">追加事实</text>
  <text x="1460" y="528" text-anchor="middle" class="node-sub">补记 / 冲正</text>
  <text x="1460" y="547" text-anchor="middle" class="node-sub">调账 / 追偿</text>

  <path d="M 1030 285 L 1030 355 L 370 355 L 370 470" class="arrow-ops"/>
  <rect x="706" y="344" width="158" height="24" class="label-box"/>
  <text x="785" y="361" text-anchor="middle" class="small">已成功、已过账明细</text>
  <path d="M 460 520 L 500 520" class="arrow-ops"/>
  <path d="M 680 520 L 720 520" class="arrow-ops"/>
  <path d="M 900 520 L 940 520" class="arrow-ops"/>
  <path d="M 1120 520 L 1160 520" class="arrow-ext"/>
  <path d="M 1340 520 L 1380 520" class="arrow-risk"/>
  <path d="M 240 520 L 240 610 L 1250 610 L 1250 570" class="arrow-ext"/>
  <path d="M 1460 470 L 1460 360 L 370 360 L 370 285" class="arrow-risk"/>
  <rect x="1090" y="598" width="170" height="24" class="label-box"/>
  <text x="1175" y="615" text-anchor="middle" class="small">外部证据参与核对</text>

  <rect x="40" y="680" width="1520" height="170" class="container"/>
  <text x="60" y="713" class="section-title">资金红线与产品不变量</text>

  <rect x="70" y="735" width="225" height="72" class="node node-red"/>
  <text x="182" y="763" text-anchor="middle" class="badge-text">外部账户和支付工具</text>
  <text x="182" y="784" text-anchor="middle" class="small">只做引用，不作为内部账本主体</text>

  <rect x="315" y="735" width="225" height="72" class="node node-red"/>
  <text x="428" y="763" text-anchor="middle" class="badge-text">投影不是事实源</text>
  <text x="428" y="784" text-anchor="middle" class="small">只读派生，可重建、可重放</text>

  <rect x="560" y="735" width="225" height="72" class="node node-red"/>
  <text x="672" y="763" text-anchor="middle" class="badge-text">冻结不表达消费</text>
  <text x="672" y="784" text-anchor="middle" class="small">仅 AVAILABLE 与 FROZEN 控制</text>

  <rect x="805" y="735" width="225" height="72" class="node node-red"/>
  <text x="918" y="763" text-anchor="middle" class="badge-text">缺快照不重路由</text>
  <text x="918" y="784" text-anchor="middle" class="small">退款、撤销、争议回放原路径</text>

  <rect x="1050" y="735" width="225" height="72" class="node node-red"/>
  <text x="1162" y="763" text-anchor="middle" class="badge-text">差错不改历史账</text>
  <text x="1162" y="784" text-anchor="middle" class="small">必须追加补事实、冲正或调账</text>

  <rect x="1295" y="735" width="225" height="72" class="node node-red"/>
  <text x="1408" y="763" text-anchor="middle" class="badge-text">清分不入账</text>
  <text x="1408" y="784" text-anchor="middle" class="small">清算确认才触发账务变化</text>

  <g transform="translate(60 895)">
    <line x1="0" y1="0" x2="42" y2="0" class="arrow-main"/>
    <text x="56" y="5" class="small">主写入链路</text>
    <line x1="180" y1="0" x2="222" y2="0" class="arrow-ledger"/>
    <text x="236" y="5" class="small">账务事实链路</text>
    <line x1="390" y1="0" x2="432" y2="0" class="arrow-read"/>
    <text x="446" y="5" class="small">只读投影链路</text>
    <line x1="600" y1="0" x2="642" y2="0" class="arrow-ops"/>
    <text x="656" y="5" class="small">清结算运营链路</text>
    <line x1="830" y1="0" x2="872" y2="0" class="arrow-risk"/>
    <text x="886" y="5" class="small">差错追加事实闭环</text>
    <line x1="1080" y1="0" x2="1122" y2="0" class="arrow-ext"/>
    <text x="1136" y="5" class="small">外部证据或对账来源</text>
  </g>
</svg>
