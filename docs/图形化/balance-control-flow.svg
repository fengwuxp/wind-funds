<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 940" width="1500" height="940" role="img" aria-labelledby="title desc">
  <title id="title">余额控制流程</title>
  <desc id="desc">余额控制从请求校验、控制类型分支、冻结、解冻、调整、账本过账、投影审计到冻结后提现引用关闭的流程。</desc>
  <style>
    text { font-family: "Helvetica Neue", Helvetica, Arial, "PingFang SC", "Microsoft YaHei", "Microsoft JhengHei", "SimHei", sans-serif; fill: #111827; }
    .title { font-size: 28px; font-weight: 700; }
    .subtitle { font-size: 14px; fill: #6b7280; }
    .section-title { font-size: 16px; font-weight: 700; fill: #374151; }
    .node-title { font-size: 15px; font-weight: 700; }
    .node-sub { font-size: 12px; fill: #4b5563; }
    .small { font-size: 12px; fill: #6b7280; }
    .container { fill: #ffffff; stroke: #d1d5db; stroke-width: 1.5; stroke-dasharray: 8 7; rx: 18; ry: 18; }
    .node { fill: #ffffff; stroke: #d1d5db; stroke-width: 1.5; rx: 10; ry: 10; }
    .blue { fill: #eff6ff; stroke: #bfdbfe; }
    .green { fill: #f0fdf4; stroke: #bbf7d0; }
    .purple { fill: #faf5ff; stroke: #e9d5ff; }
    .orange { fill: #fff7ed; stroke: #fed7aa; }
    .red { fill: #fef2f2; stroke: #fecaca; }
    .teal { fill: #f0fdfa; stroke: #99f6e4; }
    .decision { fill: #ffffff; stroke: #f59e0b; stroke-width: 1.7; }
    .arrow-main { stroke: #2563eb; stroke-width: 2.6; fill: none; marker-end: url(#arrow-blue); }
    .arrow-ledger { stroke: #16a34a; stroke-width: 2.6; fill: none; marker-end: url(#arrow-green); }
    .arrow-read { stroke: #9333ea; stroke-width: 2.2; fill: none; marker-end: url(#arrow-purple); }
    .arrow-ops { stroke: #ea580c; stroke-width: 2.4; fill: none; marker-end: url(#arrow-orange); }
    .arrow-risk { stroke: #dc2626; stroke-width: 2.3; fill: none; marker-end: url(#arrow-red); stroke-dasharray: 8 6; }
    .arrow-note { stroke: #64748b; stroke-width: 2.1; fill: none; marker-end: url(#arrow-gray); stroke-dasharray: 7 6; }
  </style>
  <defs>
    <marker id="arrow-blue" markerWidth="12" markerHeight="8" refX="11" refY="4" orient="auto"><polygon points="0 0, 12 4, 0 8" fill="#2563eb"/></marker>
    <marker id="arrow-green" markerWidth="12" markerHeight="8" refX="11" refY="4" orient="auto"><polygon points="0 0, 12 4, 0 8" fill="#16a34a"/></marker>
    <marker id="arrow-purple" markerWidth="12" markerHeight="8" refX="11" refY="4" orient="auto"><polygon points="0 0, 12 4, 0 8" fill="#9333ea"/></marker>
    <marker id="arrow-orange" markerWidth="12" markerHeight="8" refX="11" refY="4" orient="auto"><polygon points="0 0, 12 4, 0 8" fill="#ea580c"/></marker>
    <marker id="arrow-red" markerWidth="12" markerHeight="8" refX="11" refY="4" orient="auto"><polygon points="0 0, 12 4, 0 8" fill="#dc2626"/></marker>
    <marker id="arrow-gray" markerWidth="12" markerHeight="8" refX="11" refY="4" orient="auto"><polygon points="0 0, 12 4, 0 8" fill="#64748b"/></marker>
  </defs>

  <rect width="1500" height="940" fill="#ffffff"/>
  <text x="56" y="55" class="title">余额控制流程</text>
  <text x="56" y="83" class="subtitle">来源：PRD 02 余额控制流程；系分 02 FundsBalanceControlService freeze / unfreeze / adjust 与冻结后提现流程</text>

  <rect x="40" y="118" width="1420" height="315" class="container"/>
  <text x="62" y="151" class="section-title">通用流程：同主体、同币种、同周期内控制余额桶，不表达跨主体价值转移</text>

  <rect x="62" y="225" width="160" height="82" class="node blue"/>
  <text x="142" y="255" text-anchor="middle" class="node-title">余额控制请求</text>
  <text x="142" y="279" text-anchor="middle" class="node-sub">freeze / unfreeze</text>
  <text x="142" y="297" text-anchor="middle" class="node-sub">adjust</text>

  <rect x="282" y="225" width="180" height="82" class="node teal"/>
  <text x="372" y="255" text-anchor="middle" class="node-title">准入校验</text>
  <text x="372" y="279" text-anchor="middle" class="node-sub">权限 / 主体 / 币种</text>
  <text x="372" y="297" text-anchor="middle" class="node-sub">周期 / 金额 / 原因</text>

  <polygon points="590,213 665,266 590,319 515,266" class="decision"/>
  <text x="590" y="260" text-anchor="middle" class="node-title">类型?</text>
  <text x="590" y="280" text-anchor="middle" class="node-sub">控制动作</text>

  <rect x="750" y="150" width="190" height="76" class="node orange"/>
  <text x="845" y="180" text-anchor="middle" class="node-title">冻结</text>
  <text x="845" y="204" text-anchor="middle" class="node-sub">创建冻结单</text>
  <text x="845" y="222" text-anchor="middle" class="node-sub">AVAILABLE -> FROZEN</text>

  <rect x="750" y="250" width="190" height="76" class="node orange"/>
  <text x="845" y="280" text-anchor="middle" class="node-title">解冻</text>
  <text x="845" y="304" text-anchor="middle" class="node-sub">校验原冻结单</text>
  <text x="845" y="322" text-anchor="middle" class="node-sub">FROZEN -> AVAILABLE</text>

  <rect x="750" y="350" width="190" height="58" class="node purple"/>
  <text x="845" y="374" text-anchor="middle" class="node-title">调整</text>
  <text x="845" y="397" text-anchor="middle" class="node-sub">差错 / 审批 / 凭证</text>

  <rect x="1030" y="225" width="180" height="82" class="node green"/>
  <text x="1120" y="255" text-anchor="middle" class="node-title">route + posting</text>
  <text x="1120" y="279" text-anchor="middle" class="node-sub">LedgerEntry</text>
  <text x="1120" y="297" text-anchor="middle" class="node-sub">账本过账</text>

  <rect x="1270" y="225" width="150" height="82" class="node purple"/>
  <text x="1345" y="255" text-anchor="middle" class="node-title">投影审计</text>
  <text x="1345" y="279" text-anchor="middle" class="node-sub">余额投影</text>
  <text x="1345" y="297" text-anchor="middle" class="node-sub">动作明细 / Audit</text>

  <path d="M 222 266 L 282 266" class="arrow-main"/>
  <path d="M 462 266 L 515 266" class="arrow-main"/>
  <path d="M 665 266 L 705 266 L 705 188 L 750 188" class="arrow-main"/>
  <path d="M 665 266 L 750 288" class="arrow-main"/>
  <path d="M 665 266 L 705 266 L 705 379 L 750 379" class="arrow-main"/>
  <path d="M 940 188 L 985 188 L 985 266 L 1030 266" class="arrow-ledger"/>
  <path d="M 940 288 L 1030 266" class="arrow-ledger"/>
  <path d="M 940 379 L 985 379 L 985 266 L 1030 266" class="arrow-ledger"/>
  <path d="M 1210 266 L 1270 266" class="arrow-read"/>

  <rect x="40" y="475" width="1420" height="230" class="container"/>
  <text x="62" y="508" class="section-title">冻结后提现：申请阶段只冻结可用性，确认阶段才由直接交易引用并关闭冻结来源</text>

  <rect x="62" y="570" width="160" height="78" class="node blue"/>
  <text x="142" y="600" text-anchor="middle" class="node-title">提现申请</text>
  <text x="142" y="624" text-anchor="middle" class="node-sub">freeze(withdrawApply)</text>

  <rect x="282" y="570" width="170" height="78" class="node orange"/>
  <text x="367" y="600" text-anchor="middle" class="node-title">冻结单</text>
  <text x="367" y="624" text-anchor="middle" class="node-sub">冻结快照 / 剩余金额</text>

  <rect x="512" y="570" width="170" height="78" class="node green"/>
  <text x="597" y="600" text-anchor="middle" class="node-title">冻结过账</text>
  <text x="597" y="624" text-anchor="middle" class="node-sub">AVAILABLE -> FROZEN</text>

  <rect x="742" y="570" width="170" height="78" class="node blue"/>
  <text x="827" y="600" text-anchor="middle" class="node-title">出款确认</text>
  <text x="827" y="624" text-anchor="middle" class="node-sub">withdraw(confirm)</text>

  <rect x="972" y="570" width="170" height="78" class="node teal"/>
  <text x="1057" y="600" text-anchor="middle" class="node-title">引用冻结来源</text>
  <text x="1057" y="624" text-anchor="middle" class="node-sub">校验剩余 / 关闭幂等</text>

  <rect x="1202" y="570" width="170" height="78" class="node green"/>
  <text x="1287" y="600" text-anchor="middle" class="node-title">独立资金事实</text>
  <text x="1287" y="624" text-anchor="middle" class="node-sub">FROZEN -> 出款路径</text>

  <path d="M 222 609 L 282 609" class="arrow-main"/>
  <path d="M 452 609 L 512 609" class="arrow-ledger"/>
  <path d="M 682 609 L 742 609" class="arrow-note"/>
  <path d="M 912 609 L 972 609" class="arrow-main"/>
  <path d="M 1142 609 L 1202 609" class="arrow-ledger"/>

  <rect x="40" y="745" width="1420" height="118" class="container"/>
  <text x="62" y="778" class="section-title">余额控制红线</text>
  <rect x="70" y="802" width="250" height="42" class="node red"/>
  <text x="195" y="829" text-anchor="middle" class="small">冻结不是消费、扣划或授权</text>
  <rect x="350" y="802" width="250" height="42" class="node red"/>
  <text x="475" y="829" text-anchor="middle" class="small">解冻不得超过剩余冻结金额</text>
  <rect x="630" y="802" width="250" height="42" class="node red"/>
  <text x="755" y="829" text-anchor="middle" class="small">adjust 必须有来源、审批、凭证</text>
  <rect x="910" y="802" width="250" height="42" class="node red"/>
  <text x="1035" y="829" text-anchor="middle" class="small">不做 FX，不隐式换汇</text>
  <rect x="1190" y="802" width="250" height="42" class="node red"/>
  <text x="1315" y="829" text-anchor="middle" class="small">不直接修改历史分录或投影</text>
</svg>
