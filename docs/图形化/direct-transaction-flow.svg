<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 860" width="1500" height="860" role="img" aria-labelledby="title desc">
  <title id="title">直接交易流程</title>
  <desc id="desc">直接交易从调用方请求、指令转换、统一编排、路由解析、生命周期记录、账务计划、账本过账到投影视图的流程，并标注幂等、失败无副作用和资金红线。</desc>
  <style>
    text { font-family: "Helvetica Neue", Helvetica, Arial, "PingFang SC", "Microsoft YaHei", "Microsoft JhengHei", "SimHei", sans-serif; fill: #111827; }
    .title { font-size: 28px; font-weight: 700; }
    .subtitle { font-size: 14px; fill: #6b7280; }
    .section-title { font-size: 16px; font-weight: 700; fill: #374151; }
    .node-title { font-size: 15px; font-weight: 700; }
    .node-sub { font-size: 12px; fill: #4b5563; }
    .small { font-size: 12px; fill: #6b7280; }
    .container { fill: #ffffff; stroke: #d1d5db; stroke-width: 1.5; stroke-dasharray: 8 7; rx: 18; ry: 18; }
    .node { fill: #ffffff; stroke: #d1d5db; stroke-width: 1.5; rx: 10; ry: 10; }
    .blue { fill: #eff6ff; stroke: #bfdbfe; }
    .green { fill: #f0fdf4; stroke: #bbf7d0; }
    .purple { fill: #faf5ff; stroke: #e9d5ff; }
    .orange { fill: #fff7ed; stroke: #fed7aa; }
    .red { fill: #fef2f2; stroke: #fecaca; }
    .teal { fill: #f0fdfa; stroke: #99f6e4; }
    .decision { fill: #ffffff; stroke: #f59e0b; stroke-width: 1.7; }
    .arrow-main { stroke: #2563eb; stroke-width: 2.6; fill: none; marker-end: url(#arrow-blue); }
    .arrow-ledger { stroke: #16a34a; stroke-width: 2.6; fill: none; marker-end: url(#arrow-green); }
    .arrow-read { stroke: #9333ea; stroke-width: 2.2; fill: none; marker-end: url(#arrow-purple); }
    .arrow-risk { stroke: #dc2626; stroke-width: 2.3; fill: none; marker-end: url(#arrow-red); stroke-dasharray: 8 6; }
    .arrow-note { stroke: #64748b; stroke-width: 2.1; fill: none; marker-end: url(#arrow-gray); stroke-dasharray: 7 6; }
    .label-box { fill: #ffffff; opacity: 0.96; stroke: #e5e7eb; stroke-width: 1; rx: 6; ry: 6; }
  </style>
  <defs>
    <marker id="arrow-blue" markerWidth="12" markerHeight="8" refX="11" refY="4" orient="auto"><polygon points="0 0, 12 4, 0 8" fill="#2563eb"/></marker>
    <marker id="arrow-green" markerWidth="12" markerHeight="8" refX="11" refY="4" orient="auto"><polygon points="0 0, 12 4, 0 8" fill="#16a34a"/></marker>
    <marker id="arrow-purple" markerWidth="12" markerHeight="8" refX="11" refY="4" orient="auto"><polygon points="0 0, 12 4, 0 8" fill="#9333ea"/></marker>
    <marker id="arrow-red" markerWidth="12" markerHeight="8" refX="11" refY="4" orient="auto"><polygon points="0 0, 12 4, 0 8" fill="#dc2626"/></marker>
    <marker id="arrow-gray" markerWidth="12" markerHeight="8" refX="11" refY="4" orient="auto"><polygon points="0 0, 12 4, 0 8" fill="#64748b"/></marker>
  </defs>

  <rect width="1500" height="860" fill="#ffffff"/>
  <text x="56" y="55" class="title">直接交易流程</text>
  <text x="56" y="83" class="subtitle">来源：PRD 02 直接交易流程；系分 02 FundsDirectTransactionService / FundsInstructionOrchestrator 写入链路</text>

  <rect x="40" y="118" width="1420" height="300" class="container"/>
  <text x="62" y="151" class="section-title">主流程：已确认资金事实进入交易层，账本过账成功后才返回成功</text>

  <rect x="62" y="200" width="150" height="82" class="node blue"/>
  <text x="137" y="230" text-anchor="middle" class="node-title">调用方</text>
  <text x="137" y="254" text-anchor="middle" class="node-sub">topup / pay</text>
  <text x="137" y="272" text-anchor="middle" class="node-sub">transfer / refund</text>

  <rect x="252" y="200" width="150" height="82" class="node blue"/>
  <text x="327" y="230" text-anchor="middle" class="node-title">服务入口</text>
  <text x="327" y="254" text-anchor="middle" class="node-sub">FundsDirect</text>
  <text x="327" y="272" text-anchor="middle" class="node-sub">TransactionService</text>

  <rect x="442" y="200" width="150" height="82" class="node teal"/>
  <text x="517" y="230" text-anchor="middle" class="node-title">请求转换</text>
  <text x="517" y="254" text-anchor="middle" class="node-sub">InstructionConverter</text>
  <text x="517" y="272" text-anchor="middle" class="node-sub">FundsInstructionSpec</text>

  <rect x="632" y="200" width="150" height="82" class="node blue"/>
  <text x="707" y="230" text-anchor="middle" class="node-title">统一编排</text>
  <text x="707" y="254" text-anchor="middle" class="node-sub">Orchestrator</text>
  <text x="707" y="272" text-anchor="middle" class="node-sub">execute</text>

  <rect x="822" y="200" width="150" height="82" class="node orange"/>
  <text x="897" y="230" text-anchor="middle" class="node-title">路由解析</text>
  <text x="897" y="254" text-anchor="middle" class="node-sub">RouteResolver</text>
  <text x="897" y="272" text-anchor="middle" class="node-sub">ResolvedRouteSpec</text>

  <rect x="1012" y="200" width="150" height="82" class="node purple"/>
  <text x="1087" y="230" text-anchor="middle" class="node-title">生命周期</text>
  <text x="1087" y="254" text-anchor="middle" class="node-sub">beforePosting</text>
  <text x="1087" y="272" text-anchor="middle" class="node-sub">交易事实 / 快照</text>

  <rect x="1202" y="200" width="150" height="82" class="node green"/>
  <text x="1277" y="230" text-anchor="middle" class="node-title">账本过账</text>
  <text x="1277" y="254" text-anchor="middle" class="node-sub">PostingPlan</text>
  <text x="1277" y="272" text-anchor="middle" class="node-sub">LedgerEntry</text>

  <path d="M 212 241 L 252 241" class="arrow-main"/>
  <path d="M 402 241 L 442 241" class="arrow-main"/>
  <path d="M 592 241 L 632 241" class="arrow-main"/>
  <path d="M 782 241 L 822 241" class="arrow-main"/>
  <path d="M 972 241 L 1012 241" class="arrow-main"/>
  <path d="M 1162 241 L 1202 241" class="arrow-ledger"/>

  <rect x="822" y="320" width="150" height="66" class="node purple"/>
  <text x="897" y="347" text-anchor="middle" class="node-title">交易投影</text>
  <text x="897" y="370" text-anchor="middle" class="node-sub">账单 / 时间线</text>
  <path d="M 1277 282 L 1277 353 L 972 353" class="arrow-read"/>

  <rect x="1202" y="320" width="150" height="66" class="node green"/>
  <text x="1277" y="347" text-anchor="middle" class="node-title">余额投影</text>
  <text x="1277" y="370" text-anchor="middle" class="node-sub">LedgerEntry 派生</text>
  <path d="M 1277 282 L 1277 320" class="arrow-ledger"/>

  <rect x="632" y="320" width="150" height="66" class="node blue"/>
  <text x="707" y="347" text-anchor="middle" class="node-title">返回结果</text>
  <text x="707" y="370" text-anchor="middle" class="node-sub">交易流水号 / 状态</text>
  <path d="M 1202 353 L 782 353" class="arrow-read"/>

  <rect x="40" y="460" width="1420" height="220" class="container"/>
  <text x="62" y="493" class="section-title">失败与幂等分支：失败不能留下账务副作用</text>

  <polygon points="330,535 390,590 330,645 270,590" class="decision"/>
  <text x="330" y="584" text-anchor="middle" class="node-title">幂等?</text>
  <text x="330" y="604" text-anchor="middle" class="node-sub">业务键 + 摘要</text>

  <rect x="62" y="550" width="150" height="78" class="node red"/>
  <text x="137" y="581" text-anchor="middle" class="node-title">摘要冲突</text>
  <text x="137" y="605" text-anchor="middle" class="node-sub">拒绝请求</text>
  <text x="137" y="623" text-anchor="middle" class="node-sub">无 route / entry</text>

  <rect x="450" y="550" width="160" height="78" class="node orange"/>
  <text x="530" y="581" text-anchor="middle" class="node-title">幂等命中</text>
  <text x="530" y="605" text-anchor="middle" class="node-sub">复用原交易事实</text>
  <text x="530" y="623" text-anchor="middle" class="node-sub">不重复入账</text>

  <rect x="688" y="550" width="170" height="78" class="node red"/>
  <text x="773" y="581" text-anchor="middle" class="node-title">路由失败</text>
  <text x="773" y="605" text-anchor="middle" class="node-sub">主体 / 币种 / 账户</text>
  <text x="773" y="623" text-anchor="middle" class="node-sub">失败且无 posting</text>

  <rect x="936" y="550" width="170" height="78" class="node red"/>
  <text x="1021" y="581" text-anchor="middle" class="node-title">账本失败</text>
  <text x="1021" y="605" text-anchor="middle" class="node-sub">不展示成功</text>
  <text x="1021" y="623" text-anchor="middle" class="node-sub">markFailed / 告警</text>

  <rect x="1184" y="550" width="190" height="78" class="node red"/>
  <text x="1279" y="581" text-anchor="middle" class="node-title">原事实缺失</text>
  <text x="1279" y="605" text-anchor="middle" class="node-sub">退款 / 退费 / 冻结来源</text>
  <text x="1279" y="623" text-anchor="middle" class="node-sub">不得按当前绑定重路由</text>

  <path d="M 330 282 L 330 535" class="arrow-note"/>
  <path d="M 270 590 L 212 590" class="arrow-risk"/>
  <path d="M 390 590 L 450 590" class="arrow-main"/>
  <path d="M 897 282 L 897 505 L 773 505 L 773 550" class="arrow-risk"/>
  <path d="M 1277 282 L 1277 505 L 1021 505 L 1021 550" class="arrow-risk"/>
  <path d="M 897 282 L 897 505 L 1279 505 L 1279 550" class="arrow-risk"/>

  <rect x="40" y="720" width="1420" height="86" class="container"/>
  <text x="62" y="753" class="section-title">验收红线</text>
  <text x="82" y="783" class="small">1. 只承接已确认资金事实，不替代业务订单或外部通道状态机。</text>
  <text x="470" y="783" class="small">2. 本金、费用、成本、补贴、追偿和调账必须拆分表达。</text>
  <text x="895" y="783" class="small">3. 外部账户和支付工具只做引用，不作为内部账本主体。</text>
</svg>
