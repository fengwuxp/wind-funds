<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 980" width="1400" height="980">
  <style>
    text { font-family: 'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'SimHei', sans-serif; fill: #111827; }
    .title { font-size: 26px; font-weight: 700; }
    .subtitle { font-size: 13px; fill: #6b7280; }
    .lane-title { font-size: 13px; font-weight: 700; fill: #374151; }
    .node-title { font-size: 15px; font-weight: 700; }
    .node-sub { font-size: 12px; fill: #4b5563; }
    .small { font-size: 11px; fill: #6b7280; }
    .legend { font-size: 12px; fill: #4b5563; }
  </style>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/>
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#9333ea"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ea580c"/>
    </marker>
    <marker id="arrow-x" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="1400" height="980" fill="#ffffff"/>

  <text x="40" y="48" class="title">收单业务产品架构图</text>
  <text x="40" y="74" class="subtitle">定位：wind-funds 支撑收单资金底座，不承接完整收单产品、支付网关、商户入网、PCI Token Vault 或外部协议系统。</text>

  <rect x="32" y="105" width="1336" height="130" rx="10" fill="#f8fafc" stroke="#d1d5db" stroke-dasharray="7,5"/>
  <text x="52" y="130" class="lane-title">业务与收单产品层（外部边界）</text>

  <rect x="64" y="152" width="170" height="58" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="149" y="176" text-anchor="middle" class="node-title">业务交易系统</text>
  <text x="149" y="196" text-anchor="middle" class="node-sub">订单 / 履约 / 售后</text>

  <rect x="288" y="152" width="180" height="58" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="378" y="176" text-anchor="middle" class="node-title">外部收单产品</text>
  <text x="378" y="196" text-anchor="middle" class="node-sub">支付单 / 支付尝试</text>

  <rect x="522" y="152" width="180" height="58" rx="8" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="612" y="176" text-anchor="middle" class="node-title">支付网关 / 通道</text>
  <text x="612" y="196" text-anchor="middle" class="node-sub">PSP / 银行 / 卡组织</text>

  <rect x="756" y="152" width="190" height="58" rx="8" fill="#faf5ff" stroke="#e9d5ff"/>
  <text x="851" y="176" text-anchor="middle" class="node-title">商户 / 风控 / 合规</text>
  <text x="851" y="196" text-anchor="middle" class="node-sub">KYB / MCC / 阻断</text>

  <rect x="1000" y="152" width="170" height="58" rx="8" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="1085" y="176" text-anchor="middle" class="node-title">商户 / 运营</text>
  <text x="1085" y="196" text-anchor="middle" class="node-sub">账单 / 结算 / 差错</text>

  <rect x="1218" y="152" width="120" height="58" rx="8" fill="#fef2f2" stroke="#fecaca"/>
  <text x="1278" y="176" text-anchor="middle" class="node-title">专业确认</text>
  <text x="1278" y="196" text-anchor="middle" class="node-sub">法务 / 财税</text>

  <rect x="32" y="268" width="1336" height="440" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="52" y="292" width="1296" height="48" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="700" y="322" text-anchor="middle" class="node-title">wind-funds：收单资金底座能力边界</text>

  <rect x="64" y="380" width="170" height="78" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="149" y="405" text-anchor="middle" class="node-title">收单事件承接</text>
  <text x="149" y="425" text-anchor="middle" class="node-sub">AcquiringEventRef</text>
  <text x="149" y="443" text-anchor="middle" class="node-sub">幂等 / 乱序 / 摘要</text>

  <rect x="286" y="380" width="170" height="78" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="371" y="405" text-anchor="middle" class="node-title">资金交易</text>
  <text x="371" y="425" text-anchor="middle" class="node-sub">FundsInstruction</text>
  <text x="371" y="443" text-anchor="middle" class="node-sub">交易事实 / 生命周期</text>

  <rect x="508" y="380" width="170" height="78" rx="8" fill="#f0fdfa" stroke="#5eead4"/>
  <text x="593" y="405" text-anchor="middle" class="node-title">资金路由</text>
  <text x="593" y="425" text-anchor="middle" class="node-sub">商户 / 平台 / 费用</text>
  <text x="593" y="443" text-anchor="middle" class="node-sub">route snapshot</text>

  <rect x="730" y="380" width="170" height="78" rx="8" fill="#f0fdf4" stroke="#86efac"/>
  <text x="815" y="405" text-anchor="middle" class="node-title">钱包账户</text>
  <text x="815" y="425" text-anchor="middle" class="node-sub">CLEARING / AVAILABLE</text>
  <text x="815" y="443" text-anchor="middle" class="node-sub">SETTLEMENT / RESERVE</text>

  <rect x="952" y="380" width="170" height="78" rx="8" fill="#f0fdf4" stroke="#86efac"/>
  <text x="1037" y="405" text-anchor="middle" class="node-title">账本事实</text>
  <text x="1037" y="425" text-anchor="middle" class="node-sub">posting plan</text>
  <text x="1037" y="443" text-anchor="middle" class="node-sub">ledger entry</text>

  <rect x="1174" y="380" width="150" height="78" rx="8" fill="#f0fdf4" stroke="#86efac"/>
  <text x="1249" y="405" text-anchor="middle" class="node-title">余额投影</text>
  <text x="1249" y="425" text-anchor="middle" class="node-sub">可重建</text>
  <text x="1249" y="443" text-anchor="middle" class="node-sub">不可反写</text>

  <rect x="186" y="542" width="190" height="82" rx="8" fill="#fff7ed" stroke="#fdba74"/>
  <text x="281" y="568" text-anchor="middle" class="node-title">清分 / 清算</text>
  <text x="281" y="588" text-anchor="middle" class="node-sub">候选 / 批次 / 规则</text>
  <text x="281" y="606" text-anchor="middle" class="node-sub">前置对账和阻断</text>

  <rect x="430" y="542" width="190" height="82" rx="8" fill="#fff7ed" stroke="#fdba74"/>
  <text x="525" y="568" text-anchor="middle" class="node-title">结算 / 出款</text>
  <text x="525" y="588" text-anchor="middle" class="node-sub">结算锁定 / 在途</text>
  <text x="525" y="606" text-anchor="middle" class="node-sub">回单 / 失败回退</text>

  <rect x="674" y="542" width="190" height="82" rx="8" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="769" y="568" text-anchor="middle" class="node-title">对账 / 差错</text>
  <text x="769" y="588" text-anchor="middle" class="node-sub">通道 / 银行 / 账本</text>
  <text x="769" y="606" text-anchor="middle" class="node-sub">调账 / 核销 / 重对账</text>

  <rect x="918" y="542" width="190" height="82" rx="8" fill="#faf5ff" stroke="#c084fc"/>
  <text x="1013" y="568" text-anchor="middle" class="node-title">逆向 / 争议</text>
  <text x="1013" y="588" text-anchor="middle" class="node-sub">退款 / 撤销 / 拒付</text>
  <text x="1013" y="606" text-anchor="middle" class="node-sub">原路径回放 / 追偿</text>

  <rect x="1162" y="542" width="150" height="82" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="1237" y="568" text-anchor="middle" class="node-title">归档重放</text>
  <text x="1237" y="588" text-anchor="middle" class="node-sub">Manifest / replay</text>
  <text x="1237" y="606" text-anchor="middle" class="node-sub">差异报告</text>

  <path d="M234 181 L288 181" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#arrow-blue)"/>
  <path d="M468 181 L522 181" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#arrow-blue)"/>
  <path d="M612 210 C612 255 149 330 149 380" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#arrow-blue)"/>
  <path d="M851 210 C851 250 200 330 200 380" stroke="#9333ea" stroke-width="2" fill="none" marker-end="url(#arrow-purple)"/>
  <path d="M234 419 L286 419" stroke="#2563eb" stroke-width="2.2" fill="none" marker-end="url(#arrow-blue)"/>
  <path d="M456 419 L508 419" stroke="#2563eb" stroke-width="2.2" fill="none" marker-end="url(#arrow-blue)"/>
  <path d="M678 419 L730 419" stroke="#16a34a" stroke-width="2.2" fill="none" marker-end="url(#arrow-green)"/>
  <path d="M900 419 L952 419" stroke="#16a34a" stroke-width="2.2" fill="none" marker-end="url(#arrow-green)"/>
  <path d="M1122 419 L1174 419" stroke="#16a34a" stroke-width="2.2" fill="none" marker-end="url(#arrow-green)"/>

  <path d="M1037 458 C1037 505 281 500 281 542" stroke="#ea580c" stroke-width="2" fill="none" marker-end="url(#arrow-orange)"/>
  <path d="M376 583 L430 583" stroke="#ea580c" stroke-width="2" fill="none" marker-end="url(#arrow-orange)"/>
  <path d="M620 583 L674 583" stroke="#dc2626" stroke-width="2" fill="none" marker-end="url(#arrow-x)"/>
  <path d="M864 583 L918 583" stroke="#dc2626" stroke-width="2" fill="none" marker-end="url(#arrow-x)"/>
  <path d="M1108 583 L1162 583" stroke="#9333ea" stroke-width="2" fill="none" marker-end="url(#arrow-purple)"/>

  <path d="M1249 458 C1348 500 1348 250 1170 198" stroke="#16a34a" stroke-width="1.8" stroke-dasharray="7,5" fill="none" marker-end="url(#arrow-green)"/>
  <path d="M769 624 C930 704 1220 704 1168 205" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="7,5" fill="none" marker-end="url(#arrow-x)"/>

  <rect x="32" y="746" width="420" height="152" rx="10" fill="#f8fafc" stroke="#d1d5db"/>
  <text x="52" y="774" class="node-title">状态红线</text>
  <text x="56" y="800" class="small">1. 授权成功不等于商户可结算。</text>
  <text x="56" y="824" class="small">2. capture / 支付成功不等于银行到账。</text>
  <text x="56" y="848" class="small">3. 清分确认不写账，清算确认才改变可结算口径。</text>
  <text x="56" y="872" class="small">4. 拒付不是普通退款，必须保留争议和追偿语义。</text>

  <rect x="490" y="746" width="430" height="152" rx="10" fill="#fff7ed" stroke="#fdba74"/>
  <text x="510" y="774" class="node-title">不进入 wind-funds 的能力</text>
  <text x="514" y="800" class="small">商户入网 / KYB / MCC / 合同费率</text>
  <text x="514" y="824" class="small">收银台 / SDK / 支付方式展示 / 支付体验</text>
  <text x="514" y="848" class="small">PSP / 银行 / 卡组织报文、密钥、签名和协议适配</text>
  <text x="514" y="872" class="small">PAN / CVV / 原始卡数据 / Token Vault</text>

  <rect x="958" y="746" width="410" height="152" rx="10" fill="#f0fdf4" stroke="#86efac"/>
  <text x="978" y="774" class="node-title">图例</text>
  <line x1="982" y1="802" x2="1030" y2="802" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="1042" y="806" class="legend">业务 / 支付信息流</text>
  <line x1="982" y1="826" x2="1030" y2="826" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="1042" y="830" class="legend">账户 / 账务流</text>
  <line x1="982" y1="850" x2="1030" y2="850" stroke="#ea580c" stroke-width="2" marker-end="url(#arrow-orange)"/>
  <text x="1042" y="854" class="legend">清结算 / 出款流</text>
  <line x1="982" y1="874" x2="1030" y2="874" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow-x)"/>
  <text x="1042" y="878" class="legend">对账 / 争议 / 风险流</text>

  <text x="40" y="948" class="subtitle">输出边界：本图用于收单业务设计评审；不代表已开放编码、生产清结算、持牌清算、PCI 或外部卡组织规则能力。</text>
</svg>
