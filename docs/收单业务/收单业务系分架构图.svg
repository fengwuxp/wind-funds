  <rect x="118" y="682" width="180" height="58" rx="8" fill="#fff7ed" stroke="#fdba74"/>
  <text x="208" y="705" text-anchor="middle" class="node-title">reconciliation-face</text>
  <text x="208" y="723" text-anchor="middle" class="node-sub">对账 / 清结算契约</text>
  <rect x="338" y="682" width="190" height="58" rx="8" fill="#fff7ed" stroke="#fdba74"/>
  <text x="433" y="705" text-anchor="middle" class="node-title">reconciliation-impl</text>
  <text x="433" y="723" text-anchor="middle" class="node-sub">清分 / 清算 / 结算 / 出款</text>
  <rect x="568" y="682" width="170" height="58" rx="8" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="653" y="705" text-anchor="middle" class="node-title">exception case</text>
  <text x="653" y="723" text-anchor="middle" class="node-sub">差错 / 调账 / 核销</text>
  <rect x="778" y="682" width="170" height="58" rx="8" fill="#faf5ff" stroke="#d8b4fe"/>
  <text x="863" y="705" text-anchor="middle" class="node-title">projection</text>
  <text x="863" y="723" text-anchor="middle" class="node-sub">商户账单 / 时间线</text>
  <rect x="988" y="682" width="170" height="58" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="1073" y="705" text-anchor="middle" class="node-title">governance</text>
  <text x="1073" y="723" text-anchor="middle" class="node-sub">归档 / 重放 / 差异</text>

  <ellipse cx="1240" cy="694" rx="52" ry="15" fill="#ecfeff" stroke="#67e8f9"/>
  <rect x="1188" y="694" width="104" height="50" fill="#ecfeff" stroke="none"/>
  <line x1="1188" y1="694" x2="1188" y2="744" stroke="#67e8f9"/>
  <line x1="1292" y1="694" x2="1292" y2="744" stroke="#67e8f9"/>
  <ellipse cx="1240" cy="744" rx="52" ry="15" fill="#cffafe" stroke="#67e8f9"/>
  <text x="1240" y="724" text-anchor="middle" class="node-title">audit store</text>
  <text x="1240" y="741" text-anchor="middle" class="node-sub">digest / evidence</text>

  <path d="M432 180 L470 180" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <path d="M347 206 C347 248 320 290 320 330" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#arrow-blue)"/>
