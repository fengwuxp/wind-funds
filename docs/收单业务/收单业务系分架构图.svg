  <rect x="518" y="490" width="156" height="62" rx="8" fill="#f0fdfa" stroke="#5eead4"/>
  <text x="596" y="514" text-anchor="middle" class="node-title">route resolver</text>
  <text x="596" y="533" text-anchor="middle" class="node-sub">商户 / 平台 / 费用</text>
  <rect x="714" y="490" width="150" height="62" rx="8" fill="#f0fdf4" stroke="#86efac"/>
  <text x="789" y="514" text-anchor="middle" class="node-title">wallet account</text>
  <text x="789" y="533" text-anchor="middle" class="node-sub">余额桶 / 账户约束</text>
  <rect x="904" y="490" width="150" height="62" rx="8" fill="#f0fdf4" stroke="#86efac"/>
  <text x="979" y="514" text-anchor="middle" class="node-title">ledger-face</text>
  <text x="979" y="533" text-anchor="middle" class="node-sub">账本写入契约</text>
  <rect x="1094" y="490" width="170" height="62" rx="8" fill="#f0fdf4" stroke="#86efac"/>
  <text x="1179" y="514" text-anchor="middle" class="node-title">ledger-impl</text>
  <text x="1179" y="533" text-anchor="middle" class="node-sub">分录 / 余额投影</text>

  <rect x="64" y="626" width="1304" height="152" rx="8" fill="#ffffff" stroke="#d1d5db"/>
