  <rect x="230" y="330" width="180" height="46" rx="7" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="320" y="350" text-anchor="middle" class="node-title">AcquiringEventIngestPort</text>
  <text x="320" y="367" text-anchor="middle" class="node-sub">中立事件 / 幂等 / 脱敏</text>
  <rect x="458" y="330" width="180" height="46" rx="7" fill="#eff6ff" stroke="#bfdbfe"/>
