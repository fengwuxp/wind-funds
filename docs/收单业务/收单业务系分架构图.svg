  <path d="M433 740 C470 820 1160 840 1065 202" stroke="#16a34a" stroke-width="1.8" stroke-dasharray="7,5" fill="none" marker-end="url(#arrow-green)"/>
  <path d="M1073 740 C1100 830 1325 830 1325 206" stroke="#9333ea" stroke-width="1.8" stroke-dasharray="7,5" fill="none" marker-end="url(#arrow-purple)"/>

  <rect x="36" y="852" width="420" height="126" rx="10" fill="#f8fafc" stroke="#d1d5db"/>
  <text x="56" y="879" class="node-title">模块边界红线</text>
  <text x="60" y="904" class="small">1. core / ledger 不依赖外部通道、报文、SDK 或 Mapper 细节。</text>
  <text x="60" y="928" class="small">2. route 只解析资金路径，不写交易事实或账本事实。</text>
  <text x="60" y="952" class="small">3. 对账通过不写账，差错必须经审批和调账事实。</text>

  <rect x="496" y="852" width="436" height="126" rx="10" fill="#fff7ed" stroke="#fdba74"/>
  <text x="516" y="879" class="node-title">当前落地策略</text>
  <text x="520" y="904" class="small">先不新增物理 acquiring 模块；以逻辑端口承接中立收单事件。</text>
  <text x="520" y="928" class="small">若未来承接支付订单 / 支付尝试生命周期，再补 ADR 和 Execution Grant。</text>
  <text x="520" y="952" class="small">编码从契约夹具开始，不直接进入完整资金流。</text>

  <rect x="972" y="852" width="432" height="126" rx="10" fill="#f0fdf4" stroke="#86efac"/>
  <text x="992" y="879" class="node-title">图例</text>
  <line x1="996" y1="906" x2="1042" y2="906" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="1054" y="910" class="legend">同步命令 / 资金事实接入</text>
  <line x1="996" y1="930" x2="1042" y2="930" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="1054" y="934" class="legend">账务 / 只读输出</text>
  <line x1="996" y1="954" x2="1042" y2="954" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow-x)"/>
  <text x="1054" y="958" class="legend">风险 / 差错 / 敏感边界</text>

  <text x="40" y="1010" class="subtitle">验证口径：本图是系统设计预案，不代表已新增模块、DDL、公共契约或生产编码授权。</text>
</svg>
