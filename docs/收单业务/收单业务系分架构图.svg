  <rect width="1440" height="1040" fill="#ffffff"/>

  <text x="40" y="48" class="title">收单业务系分架构图</text>
  <text x="40" y="74" class="subtitle">系统边界：外部收单产品和支付网关负责支付信息流，wind-funds 负责资金事实、账务、清结算、对账、投影和治理。</text>

  <rect x="36" y="108" width="1368" height="118" rx="10" fill="#f8fafc" stroke="#d1d5db" stroke-dasharray="7,5"/>
  <text x="56" y="133" class="layer">外部系统边界</text>

  <rect x="64" y="154" width="160" height="52" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="144" y="175" text-anchor="middle" class="node-title">业务交易系统</text>
  <text x="144" y="193" text-anchor="middle" class="node-sub">订单 / 履约 / 售后</text>

  <rect x="262" y="154" width="170" height="52" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="347" y="175" text-anchor="middle" class="node-title">外部收单产品</text>
  <text x="347" y="193" text-anchor="middle" class="node-sub">支付订单 / 支付尝试</text>

  <rect x="470" y="154" width="178" height="52" rx="8" fill="#fff7ed" stroke="#fdba74"/>
  <text x="559" y="175" text-anchor="middle" class="node-title">支付网关 / 通道</text>
  <text x="559" y="193" text-anchor="middle" class="node-sub">PSP / 银行 / 卡组织</text>

  <rect x="686" y="154" width="188" height="52" rx="8" fill="#faf5ff" stroke="#d8b4fe"/>
  <text x="780" y="175" text-anchor="middle" class="node-title">风控合规系统</text>
  <text x="780" y="193" text-anchor="middle" class="node-sub">KYB / 名单 / 阻断</text>

  <rect x="912" y="154" width="168" height="52" rx="8" fill="#f0fdf4" stroke="#86efac"/>
  <text x="996" y="175" text-anchor="middle" class="node-title">财务 / 审计</text>
  <text x="996" y="193" text-anchor="middle" class="node-sub">凭证 / 报表 / 核对</text>

  <rect x="1118" y="154" width="120" height="52" rx="8" fill="#fef2f2" stroke="#fecaca"/>
  <text x="1178" y="175" text-anchor="middle" class="node-title">PCI 边界</text>
  <text x="1178" y="193" text-anchor="middle" class="node-sub">Token Vault</text>

  <rect x="1276" y="154" width="98" height="52" rx="8" fill="#f8fafc" stroke="#d1d5db"/>
  <text x="1325" y="175" text-anchor="middle" class="node-title">BI / 数仓</text>
  <text x="1325" y="193" text-anchor="middle" class="node-sub">只读消费</text>

  <rect x="36" y="260" width="1368" height="560" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="56" y="288" class="layer">wind-funds 模块化单体边界</text>

  <rect x="64" y="320" width="1304" height="76" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
