  <text x="548" y="367" text-anchor="middle" class="node-sub">资金指令入口</text>
  <rect x="686" y="330" width="180" height="46" rx="7" fill="#faf5ff" stroke="#d8b4fe"/>
  <text x="776" y="350" text-anchor="middle" class="node-title">RiskDecisionRef</text>
  <text x="776" y="367" text-anchor="middle" class="node-sub">规则版本 / 阻断原因</text>
  <rect x="914" y="330" width="210" height="46" rx="7" fill="#fff7ed" stroke="#fdba74"/>
