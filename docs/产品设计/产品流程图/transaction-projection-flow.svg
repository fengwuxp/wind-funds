<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 850" width="1240" height="850" role="img" aria-label="交易投影产品流程图">
<style>
text { font-family: 'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Microsoft JhengHei', 'SimHei', sans-serif; }
.title { font-size: 24px; font-weight: 700; fill: #111827; }
.subtitle { font-size: 13px; fill: #6b7280; }
.node-title { font-size: 15px; font-weight: 700; fill: #111827; }
.node-text { font-size: 12px; fill: #374151; }
.small { font-size: 11px; fill: #6b7280; }
.lane-title { font-size: 16px; font-weight: 700; fill: #111827; }
.label { font-size: 12px; fill: #6b7280; }
</style>
<defs><marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="strokeWidth"><polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/></marker><marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="strokeWidth"><polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/></marker><marker id="arrow-rose" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="strokeWidth"><polygon points="0 0, 10 3.5, 0 7" fill="#dc2626"/></marker><marker id="arrow-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="strokeWidth"><polygon points="0 0, 10 3.5, 0 7" fill="#9333ea"/></marker><marker id="arrow-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="strokeWidth"><polygon points="0 0, 10 3.5, 0 7" fill="#ea580c"/></marker><marker id="arrow-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="strokeWidth"><polygon points="0 0, 10 3.5, 0 7" fill="#6b7280"/></marker></defs>
<rect width="1240" height="850" fill="#ffffff"/>
<text x="40" y="46" class="title">交易投影产品流程图</text>
<text x="40" y="72" class="subtitle">交易投影把事实组合成用户、商户、运营和财务可理解的只读视图，不反写资金事实</text>
<g>
<rect x="55" y="140" width="165" height="88" rx="8" ry="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>

<text x="71" y="168" class="node-title">资金事实</text>
<text x="71" y="192" class="node-text" text-anchor="start"><tspan x="71" dy="0">交易 / 授权 / 冻结</tspan><tspan x="71" dy="17">退款 / 争议</tspan></text>
</g><g>
<rect x="260" y="140" width="165" height="88" rx="8" ry="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>

<text x="276" y="168" class="node-title">账本事实</text>
<text x="276" y="192" class="node-text" text-anchor="start"><tspan x="276" dy="0">账本交易</tspan><tspan x="276" dy="17">分录引用</tspan></text>
</g><g>
<rect x="465" y="140" width="165" height="88" rx="8" ry="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>

<text x="481" y="168" class="node-title">清结算事实</text>
<text x="481" y="192" class="node-text" text-anchor="start"><tspan x="481" dy="0">清分 / 清算 / 结算</tspan><tspan x="481" dy="17">出款单</tspan></text>
</g><g>
<rect x="670" y="140" width="165" height="88" rx="8" ry="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>

<text x="686" y="168" class="node-title">对账差错</text>
<text x="686" y="192" class="node-text" text-anchor="start"><tspan x="686" dy="0">对账批次</tspan><tspan x="686" dy="17">差错 / 调账 / 核销</tspan></text>
</g><g>
<rect x="875" y="140" width="165" height="88" rx="8" ry="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>

<text x="891" y="168" class="node-title">权益资金事实</text>
<text x="891" y="192" class="node-text" text-anchor="start"><tspan x="891" dy="0">优惠券 / 代金券</tspan><tspan x="891" dy="17">补贴 / 让利 / 储值权益</tspan></text>
</g><g>
<rect x="250" y="320" width="220" height="98" rx="8" ry="8" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1.5"/>

<text x="266" y="348" class="node-title">统一投影上下文</text>
<text x="266" y="372" class="node-text" text-anchor="start"><tspan x="266" dy="0">来源事实归集</tspan><tspan x="266" dy="17">展示域选择</tspan><tspan x="266" dy="17">口径版本</tspan></text>
</g><g>
<rect x="560" y="320" width="220" height="98" rx="8" ry="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>

<text x="576" y="348" class="node-title">构建只读视图</text>
<text x="576" y="372" class="node-text" text-anchor="start"><tspan x="576" dy="0">用户账单</tspan><tspan x="576" dy="17">商户账单</tspan><tspan x="576" dy="17">运营时间线 / 财务核对</tspan></text>
</g><g><polygon points="900,314 975,368 900,422 825,368" fill="#fffbeb" stroke="#fde68a" stroke-width="1.5"/><text x="900" y="364" class="node-title" text-anchor="middle">校验通过?</text><text x="900" y="384" class="small" text-anchor="middle"><tspan x="900" dy="0">来源完整 / 摘要一致</tspan></text></g><g>
<rect x="1030" y="286" width="160" height="82" rx="8" ry="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>

<text x="1046" y="314" class="node-title">发布视图</text>
<text x="1046" y="338" class="node-text" text-anchor="start"><tspan x="1046" dy="0">PUBLISHED</tspan><tspan x="1046" dy="17">可查询 / 可导出</tspan></text>
</g><g>
<rect x="1030" y="445" width="160" height="82" rx="8" ry="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>

<text x="1046" y="473" class="node-title">差异报告</text>
<text x="1046" y="497" class="node-text" text-anchor="start"><tspan x="1046" dy="0">NEEDS_REPLAY</tspan><tspan x="1046" dy="17">待人工确认</tspan></text>
</g><line x1="137" y1="228" x2="360" y2="320" stroke="#2563eb" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow-blue)"/><line x1="342" y1="228" x2="360" y2="320" stroke="#2563eb" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow-blue)"/><line x1="547" y1="228" x2="360" y2="320" stroke="#2563eb" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow-blue)"/><line x1="752" y1="228" x2="360" y2="320" stroke="#2563eb" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow-blue)"/><line x1="957" y1="228" x2="360" y2="320" stroke="#2563eb" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow-blue)"/><g><line x1="470" y1="369" x2="560" y2="369" stroke="#9333ea" stroke-width="2" marker-end="url(#arrow-purple)"/><rect x="491" y="348" width="48" height="22" rx="11" fill="#ffffff" opacity="0.96"/><text x="515" y="363" class="label" text-anchor="middle">构建</text></g><g><line x1="780" y1="369" x2="825" y2="369" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)"/><rect x="778.5" y="348" width="48" height="22" rx="11" fill="#ffffff" opacity="0.96"/><text x="802.5" y="363" class="label" text-anchor="middle">校验</text></g><g><line x1="975" y1="340" x2="1030" y2="326" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)"/><rect x="978.5" y="312" width="48" height="22" rx="11" fill="#ffffff" opacity="0.96"/><text x="1002.5" y="327" class="label" text-anchor="middle">是</text></g><g><line x1="975" y1="396" x2="1030" y2="486" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow-rose)"/><rect x="978.5" y="420" width="48" height="22" rx="11" fill="#ffffff" opacity="0.96"/><text x="1002.5" y="435" class="label" text-anchor="middle">否</text></g><g>
<rect x="270" y="535" width="190" height="84" rx="8" ry="8" fill="#fff" stroke="#e5e7eb" stroke-width="1.5"/>

<text x="286" y="563" class="node-title">VERIFY_ONLY</text>
<text x="286" y="587" class="node-text" text-anchor="start"><tspan x="286" dy="0">只输出差异</tspan><tspan x="286" dy="17">不写正式视图</tspan></text>
</g><g>
<rect x="515" y="535" width="190" height="84" rx="8" ry="8" fill="#fff" stroke="#e5e7eb" stroke-width="1.5"/>

<text x="531" y="563" class="node-title">REBUILD_SHADOW</text>
<text x="531" y="587" class="node-text" text-anchor="start"><tspan x="531" dy="0">影子视图</tspan><tspan x="531" dy="17">比对影响范围</tspan></text>
</g><g>
<rect x="760" y="535" width="190" height="84" rx="8" ry="8" fill="#fff" stroke="#fed7aa" stroke-width="1.5"/>

<text x="776" y="563" class="node-title">REBUILD_APPLY</text>
<text x="776" y="587" class="node-text" text-anchor="start"><tspan x="776" dy="0">审批 + 回滚版本</tspan><tspan x="776" dy="17">覆盖正式只读视图</tspan></text>
</g><g><path d="M 1110 527 C 1090 620, 920 650, 865 535" fill="none" stroke="#ea580c" stroke-width="2" marker-end="url(#arrow-orange)"/><rect x="957.5" y="510" width="60" height="22" rx="11" fill="#ffffff" opacity="0.96"/><text x="987.5" y="525" class="label" text-anchor="middle">重放模式</text></g><g><rect x="55" y="670" width="1135" height="78" rx="14" ry="14" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/><text x="73" y="700" class="lane-title">投影红线</text></g><text x="82" y="716" class="node-text" text-anchor="start"><tspan x="82" dy="0">交易投影只展示事实，不补写资金交易、交易明细、账本分录或余额投影；授权拒绝、普通退款、争议拒付、退汇和 ACH return 必须保留不同展示语义。</tspan></text><g transform="translate(55,790)"><rect x="-14" y="-18" width="182" height="140" rx="10" fill="#ffffff" stroke="#e5e7eb"/><line x1="0" y1="0" x2="34" y2="0" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)" stroke-dasharray="7 5"/><text x="46" y="4" class="small">来源事实输入</text><line x1="0" y1="24" x2="34" y2="24" stroke="#9333ea" stroke-width="2" marker-end="url(#arrow-purple)"/><text x="46" y="28" class="small">上下文归集</text><line x1="0" y1="48" x2="34" y2="48" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)"/><text x="46" y="52" class="small">发布只读视图</text><line x1="0" y1="72" x2="34" y2="72" stroke="#ea580c" stroke-width="2" marker-end="url(#arrow-orange)"/><text x="46" y="76" class="small">受控重放</text><line x1="0" y1="96" x2="34" y2="96" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow-rose)"/><text x="46" y="100" class="small">差异和红线</text></g>
</svg>
