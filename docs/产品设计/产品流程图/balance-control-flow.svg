<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 960" width="1500" height="960" role="img" aria-label="余额控制产品流程图">
<style>
text{font-family:"Helvetica Neue",Helvetica,Arial,"PingFang SC","Microsoft YaHei","Microsoft JhengHei",SimHei,sans-serif;fill:#111827}
.title{font-size:24px;font-weight:700}.subtitle{font-size:13px;fill:#6b7280}.section-title{font-size:16px;font-weight:700}.node-title{font-size:14px;font-weight:700}.node-sub{font-size:12px;fill:#4b5563}.small{font-size:12px;fill:#6b7280}.label{font-size:12px;fill:#6b7280}
</style>
<defs><marker id="arrow-blue" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#2563eb"/></marker><marker id="arrow-green" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#16a34a"/></marker><marker id="arrow-rose" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#dc2626"/></marker><marker id="arrow-purple" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#9333ea"/></marker><marker id="arrow-orange" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#ea580c"/></marker><marker id="arrow-gray" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#64748b"/></marker><marker id="arrow-teal" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#0891b2"/></marker></defs>
<rect width="1500" height="960" fill="#ffffff"/>
<text x="56" y="55" class="title">余额控制产品流程图</text>
<text x="56" y="83" class="subtitle">内容对齐 docs/图形化/balance-control-flow.svg：补齐冻结、解冻、调整、冻结后提现和红线约束。</text>
<g><rect x="40" y="118" width="1420" height="315" rx="14" fill="#f8fafc" stroke="#e5e7eb" stroke-width="1.5"/><text x="62" y="152" class="section-title">通用流程：同主体、同币种、同周期内控制余额桶，不表达跨主体价值转移</text><text x="62" y="174" class="small">参考 docs/图形化/balance-control-flow.svg，补齐 freeze / unfreeze / adjust 的差异和账本投影链路。</text></g><g><rect x="62" y="225" width="160" height="82" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/><text x="142" y="255" text-anchor="middle" class="node-title">余额控制请求</text><text x="142" y="279" text-anchor="middle" class="node-sub"><tspan x="142" dy="0">freeze / unfreeze</tspan><tspan x="142" dy="18">adjust</tspan></text></g><g><rect x="282" y="225" width="180" height="82" rx="8" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/><text x="372" y="255" text-anchor="middle" class="node-title">准入校验</text><text x="372" y="279" text-anchor="middle" class="node-sub"><tspan x="372" dy="0">权限 / 主体 / 币种</tspan><tspan x="372" dy="18">周期 / 金额 / 原因</tspan></text></g><g><polygon points="590,213 665,266 590,319 515,266" fill="#fffbeb" stroke="#fde68a" stroke-width="1.5"/><text x="590" y="261" text-anchor="middle" class="node-title">类型?</text><text x="590" y="283" text-anchor="middle" class="node-sub"><tspan x="590" dy="0">控制动作</tspan></text></g><g><rect x="750" y="150" width="190" height="76" rx="8" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/><text x="845" y="180" text-anchor="middle" class="node-title">冻结</text><text x="845" y="204" text-anchor="middle" class="node-sub"><tspan x="845" dy="0">创建冻结单</tspan><tspan x="845" dy="18">AVAILABLE -&gt; FROZEN</tspan></text></g><g><rect x="750" y="250" width="190" height="76" rx="8" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/><text x="845" y="280" text-anchor="middle" class="node-title">解冻</text><text x="845" y="304" text-anchor="middle" class="node-sub"><tspan x="845" dy="0">校验原冻结单</tspan><tspan x="845" dy="18">FROZEN -&gt; AVAILABLE</tspan></text></g><g><rect x="750" y="350" width="190" height="58" rx="8" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1.5"/><text x="845" y="380" text-anchor="middle" class="node-title">调整</text><text x="845" y="404" text-anchor="middle" class="node-sub"><tspan x="845" dy="0">差错 / 审批 / 凭证</tspan></text></g><g><rect x="1030" y="225" width="180" height="82" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/><text x="1120" y="255" text-anchor="middle" class="node-title">route + posting</text><text x="1120" y="279" text-anchor="middle" class="node-sub"><tspan x="1120" dy="0">LedgerEntry</tspan><tspan x="1120" dy="18">账本过账</tspan></text></g><g><rect x="1270" y="225" width="150" height="82" rx="8" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1.5"/><text x="1345" y="255" text-anchor="middle" class="node-title">投影审计</text><text x="1345" y="279" text-anchor="middle" class="node-sub"><tspan x="1345" dy="0">余额投影</tspan><tspan x="1345" dy="18">动作明细 / Audit</tspan></text></g><g><line x1="222" y1="266" x2="282" y2="266" stroke="#2563eb" stroke-width="2.3" marker-end="url(#arrow-blue)"/></g><g><line x1="462" y1="266" x2="515" y2="266" stroke="#2563eb" stroke-width="2.3" marker-end="url(#arrow-blue)"/></g><g><path d="M 665 266 L 705 266 L 705 188 L 750 188" fill="none" stroke="#ea580c" stroke-width="2.3" marker-end="url(#arrow-orange)"/></g><g><line x1="665" y1="266" x2="750" y2="288" stroke="#ea580c" stroke-width="2.3" marker-end="url(#arrow-orange)"/></g><g><path d="M 665 266 L 705 266 L 705 379 L 750 379" fill="none" stroke="#9333ea" stroke-width="2.3" marker-end="url(#arrow-purple)"/></g><g><path d="M 940 188 L 985 188 L 985 266 L 1030 266" fill="none" stroke="#16a34a" stroke-width="2.3" marker-end="url(#arrow-green)"/></g><g><line x1="940" y1="288" x2="1030" y2="266" stroke="#16a34a" stroke-width="2.3" marker-end="url(#arrow-green)"/></g><g><path d="M 940 379 L 985 379 L 985 266 L 1030 266" fill="none" stroke="#16a34a" stroke-width="2.3" marker-end="url(#arrow-green)"/></g><g><line x1="1210" y1="266" x2="1270" y2="266" stroke="#9333ea" stroke-width="2.3" marker-end="url(#arrow-purple)"/></g><g><rect x="40" y="475" width="1420" height="230" rx="14" fill="#f8fafc" stroke="#e5e7eb" stroke-width="1.5"/><text x="62" y="509" class="section-title">冻结后提现：申请阶段只冻结可用性，确认阶段才由直接交易引用并关闭冻结来源</text><text x="62" y="531" class="small">提现申请不是扣款；出款确认才形成独立资金事实，引用冻结单而不是重新解释余额来源。</text></g><g><rect x="62" y="570" width="160" height="78" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/><text x="142" y="600" text-anchor="middle" class="node-title">提现申请</text><text x="142" y="624" text-anchor="middle" class="node-sub"><tspan x="142" dy="0">freeze(withdrawApply)</tspan></text></g><g><rect x="282" y="570" width="170" height="78" rx="8" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/><text x="367" y="600" text-anchor="middle" class="node-title">冻结单</text><text x="367" y="624" text-anchor="middle" class="node-sub"><tspan x="367" dy="0">冻结快照 / 剩余金额</tspan></text></g><g><rect x="512" y="570" width="170" height="78" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/><text x="597" y="600" text-anchor="middle" class="node-title">冻结过账</text><text x="597" y="624" text-anchor="middle" class="node-sub"><tspan x="597" dy="0">AVAILABLE -&gt; FROZEN</tspan></text></g><g><rect x="742" y="570" width="170" height="78" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/><text x="827" y="600" text-anchor="middle" class="node-title">出款确认</text><text x="827" y="624" text-anchor="middle" class="node-sub"><tspan x="827" dy="0">withdraw(confirm)</tspan></text></g><g><rect x="972" y="570" width="170" height="78" rx="8" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/><text x="1057" y="600" text-anchor="middle" class="node-title">引用冻结来源</text><text x="1057" y="624" text-anchor="middle" class="node-sub"><tspan x="1057" dy="0">校验剩余 / 关闭幂等</tspan></text></g><g><rect x="1202" y="570" width="170" height="78" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/><text x="1287" y="600" text-anchor="middle" class="node-title">独立资金事实</text><text x="1287" y="624" text-anchor="middle" class="node-sub"><tspan x="1287" dy="0">FROZEN -&gt; 出款路径</tspan></text></g><g><line x1="222" y1="609" x2="282" y2="609" stroke="#2563eb" stroke-width="2.3" marker-end="url(#arrow-blue)"/></g><g><line x1="452" y1="609" x2="512" y2="609" stroke="#16a34a" stroke-width="2.3" marker-end="url(#arrow-green)"/></g><g><line x1="682" y1="609" x2="742" y2="609" stroke="#64748b" stroke-width="2.3" stroke-dasharray="7 6" marker-end="url(#arrow-gray)"/><rect x="679" y="586" width="66" height="22" rx="11" fill="#fff" opacity="0.96"/><text x="712" y="601" text-anchor="middle" class="label">异步确认</text></g><g><line x1="912" y1="609" x2="972" y2="609" stroke="#2563eb" stroke-width="2.3" marker-end="url(#arrow-blue)"/></g><g><line x1="1142" y1="609" x2="1202" y2="609" stroke="#16a34a" stroke-width="2.3" marker-end="url(#arrow-green)"/></g><g><rect x="40" y="745" width="1420" height="118" rx="14" fill="#f8fafc" stroke="#e5e7eb" stroke-width="1.5"/><text x="62" y="779" class="section-title">余额控制红线</text></g><g><rect x="70" y="802" width="250" height="42" rx="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/><text x="195" y="832" text-anchor="middle" class="node-title">冻结不是消费、扣划或授权</text><text x="195" y="856" text-anchor="middle" class="node-sub"></text></g><g><rect x="350" y="802" width="250" height="42" rx="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/><text x="475" y="832" text-anchor="middle" class="node-title">解冻不得超过剩余冻结金额</text><text x="475" y="856" text-anchor="middle" class="node-sub"></text></g><g><rect x="630" y="802" width="250" height="42" rx="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/><text x="755" y="832" text-anchor="middle" class="node-title">adjust 必须有来源、审批、凭证</text><text x="755" y="856" text-anchor="middle" class="node-sub"></text></g><g><rect x="910" y="802" width="250" height="42" rx="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/><text x="1035" y="832" text-anchor="middle" class="node-title">不做 FX，不隐式换汇</text><text x="1035" y="856" text-anchor="middle" class="node-sub"></text></g><g><rect x="1190" y="802" width="250" height="42" rx="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/><text x="1315" y="832" text-anchor="middle" class="node-title">不直接修改历史分录或投影</text><text x="1315" y="856" text-anchor="middle" class="node-sub"></text></g><g transform="translate(56,895)"><rect x="-14" y="-18" width="310" height="144" rx="10" fill="#fff" stroke="#e5e7eb"/><line x1="0" y1="0" x2="34" y2="0" stroke="#2563eb" stroke-width="2.2" marker-end="url(#arrow-blue)"/><text x="46" y="4" class="small">请求和确认动作</text><line x1="0" y1="24" x2="34" y2="24" stroke="#ea580c" stroke-width="2.2" marker-end="url(#arrow-orange)"/><text x="46" y="28" class="small">冻结 / 解冻控制</text><line x1="0" y1="48" x2="34" y2="48" stroke="#16a34a" stroke-width="2.2" marker-end="url(#arrow-green)"/><text x="46" y="52" class="small">账本过账和资金事实</text><line x1="0" y1="72" x2="34" y2="72" stroke="#64748b" stroke-width="2.2" marker-end="url(#arrow-gray)" stroke-dasharray="7 6"/><text x="46" y="76" class="small">异步确认 / 非扣款路径</text><line x1="0" y1="96" x2="34" y2="96" stroke="undefined" stroke-width="2.2" marker-end="url(#arrow-rose)"/><text x="46" y="100" class="small">余额控制红线</text></g>
</svg>
