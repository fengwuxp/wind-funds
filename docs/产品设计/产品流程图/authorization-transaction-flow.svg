<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 900" width="1500" height="900" role="img" aria-label="授权交易产品流程图">
<style>
text{font-family:"Helvetica Neue",Helvetica,Arial,"PingFang SC","Microsoft YaHei","Microsoft JhengHei",SimHei,sans-serif;fill:#111827}
.title{font-size:24px;font-weight:700}.subtitle{font-size:13px;fill:#6b7280}.section-title{font-size:16px;font-weight:700}.node-title{font-size:14px;font-weight:700}.node-sub{font-size:12px;fill:#4b5563}.small{font-size:12px;fill:#6b7280}.label{font-size:12px;fill:#6b7280}
</style>
<defs><marker id="arrow-blue" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#2563eb"/></marker><marker id="arrow-green" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#16a34a"/></marker><marker id="arrow-rose" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#dc2626"/></marker><marker id="arrow-purple" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#9333ea"/></marker><marker id="arrow-orange" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#ea580c"/></marker><marker id="arrow-gray" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#64748b"/></marker><marker id="arrow-teal" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#0891b2"/></marker></defs>
<rect width="1500" height="900" fill="#ffffff"/>
<text x="56" y="55" class="title">授权交易产品流程图</text>
<text x="56" y="83" class="subtitle">内容对齐产品流程设计：补齐创建分叉、后续事件、有效性校验、posting 和生命周期更新。</text>
<g><rect x="40" y="118" width="1420" height="300" rx="14" fill="#f8fafc" stroke="#e5e7eb" stroke-width="1.5"/><text x="62" y="152" class="section-title">授权创建：批准后才进入 route 和账本；拒绝只记录拒绝事实</text><text x="62" y="174" class="small">保留批准/拒绝分叉和后续事件链路。</text></g><g><rect x="62" y="210" width="150" height="82" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/><text x="137" y="240" text-anchor="middle" class="node-title">授权请求</text><text x="137" y="264" text-anchor="middle" class="node-sub"><tspan x="137" dy="0">卡 / 账户 / 预算</tspan><tspan x="137" dy="18">金额 / 币种 / 工具</tspan></text></g><g><rect x="262" y="210" width="170" height="82" rx="8" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/><text x="347" y="240" text-anchor="middle" class="node-title">准入校验</text><text x="347" y="264" text-anchor="middle" class="node-sub"><tspan x="347" dy="0">幂等 / 主体 / 周期</tspan><tspan x="347" dy="18">工具 / 风控 / 策略</tspan></text></g><g><polygon points="555,199 625,251 555,303 485,251" fill="#fffbeb" stroke="#fde68a" stroke-width="1.5"/><text x="555" y="246" text-anchor="middle" class="node-title">可授权?</text><text x="555" y="268" text-anchor="middle" class="node-sub"><tspan x="555" dy="0">approve / decline</tspan></text></g><g><rect x="705" y="155" width="170" height="82" rx="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/><text x="790" y="185" text-anchor="middle" class="node-title">授权拒绝</text><text x="790" y="209" text-anchor="middle" class="node-sub"><tspan x="790" dy="0">记录原因 / 规则版本</tspan><tspan x="790" dy="18">无 route / posting / entry</tspan></text></g><g><rect x="705" y="285" width="170" height="82" rx="8" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/><text x="790" y="315" text-anchor="middle" class="node-title">授权批准</text><text x="790" y="339" text-anchor="middle" class="node-sub"><tspan x="790" dy="0">生成授权路径</tspan><tspan x="790" dy="18">AVAILABLE -&gt; AUTH</tspan></text></g><g><rect x="945" y="285" width="170" height="82" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/><text x="1030" y="315" text-anchor="middle" class="node-title">账本过账</text><text x="1030" y="339" text-anchor="middle" class="node-sub"><tspan x="1030" dy="0">保存 route snapshot</tspan><tspan x="1030" dy="18">余额投影</tspan></text></g><g><rect x="1185" y="285" width="170" height="82" rx="8" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1.5"/><text x="1270" y="315" text-anchor="middle" class="node-title">授权占用</text><text x="1270" y="339" text-anchor="middle" class="node-sub"><tspan x="1270" dy="0">HELD / 剩余可处理</tspan><tspan x="1270" dy="18">等待后续事件</tspan></text></g><g><line x1="212" y1="251" x2="262" y2="251" stroke="#2563eb" stroke-width="2.3" marker-end="url(#arrow-blue)"/></g><g><line x1="432" y1="251" x2="485" y2="251" stroke="#2563eb" stroke-width="2.3" marker-end="url(#arrow-blue)"/></g><g><path d="M 625 251 L 665 251 L 665 196 L 705 196" fill="none" stroke="#2563eb" stroke-width="2.3" marker-end="url(#arrow-rose)"/><rect x="646" y="166" width="44" height="22" rx="11" fill="#fff" opacity="0.96"/><text x="668" y="181" text-anchor="middle" class="label">否</text></g><g><path d="M 625 251 L 665 251 L 665 326 L 705 326" fill="none" stroke="#2563eb" stroke-width="2.3" marker-end="url(#arrow-blue)"/><rect x="646" y="296" width="44" height="22" rx="11" fill="#fff" opacity="0.96"/><text x="668" y="311" text-anchor="middle" class="label">是</text></g><g><line x1="875" y1="326" x2="945" y2="326" stroke="#16a34a" stroke-width="2.3" marker-end="url(#arrow-green)"/></g><g><line x1="1115" y1="326" x2="1185" y2="326" stroke="#9333ea" stroke-width="2.3" marker-end="url(#arrow-purple)"/></g><g><rect x="40" y="460" width="1420" height="295" rx="14" fill="#f8fafc" stroke="#e5e7eb" stroke-width="1.5"/><text x="62" y="494" class="section-title">后续事件：先校验原事实、剩余金额和幂等摘要，再按原快照或受控策略入账</text><text x="62" y="516" class="small">reversal / expire / settle / settleRefund 不能按当前绑定关系重新解释历史。</text></g><g><rect x="62" y="555" width="170" height="82" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/><text x="147" y="585" text-anchor="middle" class="node-title">归一后事件</text><text x="147" y="609" text-anchor="middle" class="node-sub"><tspan x="147" dy="0">reversal / expire</tspan><tspan x="147" dy="18">settle / settleRefund</tspan></text></g><g><rect x="292" y="555" width="170" height="82" rx="8" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/><text x="377" y="585" text-anchor="middle" class="node-title">引用校验</text><text x="377" y="609" text-anchor="middle" class="node-sub"><tspan x="377" dy="0">原授权 / 原完成</tspan><tspan x="377" dy="18">策略 / 凭证 / 剩余金额</tspan></text></g><g><polygon points="595,544 665,596 595,648 525,596" fill="#fffbeb" stroke="#fde68a" stroke-width="1.5"/><text x="595" y="591" text-anchor="middle" class="node-title">有效?</text><text x="595" y="613" text-anchor="middle" class="node-sub"><tspan x="595" dy="0">引用 + 金额</tspan></text></g><g><rect x="755" y="485" width="170" height="72" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/><text x="840" y="515" text-anchor="middle" class="node-title">撤销 / 过期</text><text x="840" y="539" text-anchor="middle" class="node-sub"><tspan x="840" dy="0">AUTH -&gt; AVAILABLE</tspan></text></g><g><rect x="755" y="595" width="170" height="72" rx="8" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/><text x="840" y="625" text-anchor="middle" class="node-title">结算完成</text><text x="840" y="649" text-anchor="middle" class="node-sub"><tspan x="840" dy="0">AUTH -&gt; 收款方 / CLEARING</tspan></text></g><g><rect x="755" y="690" width="170" height="48" rx="8" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1.5"/><text x="840" y="720" text-anchor="middle" class="node-title">结算后退款 / 拒付</text><text x="840" y="744" text-anchor="middle" class="node-sub"></text></g><g><rect x="1010" y="555" width="170" height="82" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/><text x="1095" y="585" text-anchor="middle" class="node-title">生成 posting</text><text x="1095" y="609" text-anchor="middle" class="node-sub"><tspan x="1095" dy="0">账本入账</tspan><tspan x="1095" dy="18">投影视图区分语义</tspan></text></g><g><rect x="1245" y="555" width="170" height="82" rx="8" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1.5"/><text x="1330" y="585" text-anchor="middle" class="node-title">更新生命周期</text><text x="1330" y="609" text-anchor="middle" class="node-sub"><tspan x="1330" dy="0">累计完成 / 释放</tspan><tspan x="1330" dy="18">终态可解释</tspan></text></g><g><rect x="525" y="680" width="140" height="58" rx="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/><text x="595" y="710" text-anchor="middle" class="node-title">失败 / 差错</text><text x="595" y="734" text-anchor="middle" class="node-sub"><tspan x="595" dy="0">无 ledger entry</tspan></text></g><g><line x1="232" y1="596" x2="292" y2="596" stroke="#2563eb" stroke-width="2.3" marker-end="url(#arrow-blue)"/></g><g><line x1="462" y1="596" x2="525" y2="596" stroke="#2563eb" stroke-width="2.3" marker-end="url(#arrow-blue)"/></g><g><line x1="595" y1="648" x2="595" y2="680" stroke="#2563eb" stroke-width="2.3" marker-end="url(#arrow-rose)"/></g><g><path d="M 665 596 L 705 596 L 705 521 L 755 521" fill="none" stroke="#16a34a" stroke-width="2.3" marker-end="url(#arrow-green)"/></g><g><line x1="665" y1="596" x2="755" y2="631" stroke="#ea580c" stroke-width="2.3" marker-end="url(#arrow-orange)"/></g><g><path d="M 665 596 L 705 596 L 705 714 L 755 714" fill="none" stroke="#9333ea" stroke-width="2.3" marker-end="url(#arrow-purple)"/></g><g><path d="M 925 521 L 965 521 L 965 596 L 1010 596" fill="none" stroke="#16a34a" stroke-width="2.3" marker-end="url(#arrow-green)"/></g><g><line x1="925" y1="631" x2="1010" y2="596" stroke="#16a34a" stroke-width="2.3" marker-end="url(#arrow-green)"/></g><g><path d="M 925 714 L 965 714 L 965 596 L 1010 596" fill="none" stroke="#16a34a" stroke-width="2.3" marker-end="url(#arrow-green)"/></g><g><line x1="1180" y1="596" x2="1245" y2="596" stroke="#9333ea" stroke-width="2.3" marker-end="url(#arrow-purple)"/></g><g><rect x="40" y="800" width="1420" height="74" rx="14" fill="#f8fafc" stroke="#e5e7eb" stroke-width="1.5"/><text x="62" y="834" class="section-title">授权红线</text></g><text x="82" y="833" text-anchor="start" class="small"><tspan x="82" dy="0">1. 授权拒绝不得生成 RouteLeg、PostingPlan、LedgerEntry 或 chargebackAmount。</tspan><tspan x="82" dy="22">2. 授权成功不是最终消费；完成不新增 CONSUMED，不触碰 LIMIT。</tspan><tspan x="82" dy="22">3. 默认无 close 事件，历史逆向优先回放原快照。</tspan></text><g transform="translate(1035,806)"><rect x="-14" y="-18" width="310" height="120" rx="10" fill="#fff" stroke="#e5e7eb"/><line x1="0" y1="0" x2="34" y2="0" stroke="#2563eb" stroke-width="2.2" marker-end="url(#arrow-blue)"/><text x="46" y="4" class="small">授权请求和引用校验</text><line x1="0" y1="24" x2="34" y2="24" stroke="#16a34a" stroke-width="2.2" marker-end="url(#arrow-green)"/><text x="46" y="28" class="small">释放 / 过账</text><line x1="0" y1="48" x2="34" y2="48" stroke="#9333ea" stroke-width="2.2" marker-end="url(#arrow-purple)"/><text x="46" y="52" class="small">生命周期和只读视图</text><line x1="0" y1="72" x2="34" y2="72" stroke="#dc2626" stroke-width="2.2" marker-end="url(#arrow-rose)" stroke-dasharray="7 6"/><text x="46" y="76" class="small">拒绝 / 差错无分录</text></g>
</svg>
