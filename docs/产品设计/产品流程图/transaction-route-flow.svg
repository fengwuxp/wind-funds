<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 720" width="1220" height="720" role="img" aria-label="交易路由产品流程图">
<style>
text { font-family: 'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Microsoft JhengHei', 'SimHei', sans-serif; }
.title { font-size: 24px; font-weight: 700; fill: #111827; }
.subtitle { font-size: 13px; fill: #6b7280; }
.node-title { font-size: 15px; font-weight: 700; fill: #111827; }
.node-text { font-size: 12px; fill: #374151; }
.small { font-size: 11px; fill: #6b7280; }
.lane-title { font-size: 16px; font-weight: 700; fill: #111827; }
.label { font-size: 12px; fill: #6b7280; }
</style>
<defs><marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="strokeWidth"><polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/></marker><marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="strokeWidth"><polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/></marker><marker id="arrow-rose" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="strokeWidth"><polygon points="0 0, 10 3.5, 0 7" fill="#dc2626"/></marker><marker id="arrow-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="strokeWidth"><polygon points="0 0, 10 3.5, 0 7" fill="#9333ea"/></marker><marker id="arrow-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="strokeWidth"><polygon points="0 0, 10 3.5, 0 7" fill="#ea580c"/></marker><marker id="arrow-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="strokeWidth"><polygon points="0 0, 10 3.5, 0 7" fill="#6b7280"/></marker></defs>
<rect width="1220" height="720" fill="#ffffff"/>
<text x="40" y="46" class="title">交易路由产品流程图</text>
<text x="40" y="72" class="subtitle">资金路由承接 P0/P1：解析主体、账目、周期和快照，但不替代业务判断或账本过账</text>
<g>
<rect x="60" y="150" width="220" height="100" rx="8" ry="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>

<text x="76" y="178" class="node-title">资金事实输入</text>
<text x="76" y="202" class="node-text" text-anchor="start"><tspan x="76" dy="0">业务流水 / 金额组件</tspan><tspan x="76" dy="17">权益快照 / 支付工具</tspan><tspan x="76" dy="17">外部引用摘要</tspan></text>
</g><g>
<rect x="60" y="310" width="220" height="100" rx="8" ry="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>

<text x="76" y="338" class="node-title">原路径回放输入</text>
<text x="76" y="362" class="node-text" text-anchor="start"><tspan x="76" dy="0">退款 / 撤销 / 争议</tspan><tspan x="76" dy="17">清结算 / 对账处理</tspan><tspan x="76" dy="17">原 route snapshot 引用</tspan></text>
</g><g>
<rect x="360" y="150" width="220" height="100" rx="8" ry="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>

<text x="376" y="178" class="node-title">主体和账户定位</text>
<text x="376" y="202" class="node-text" text-anchor="start"><tspan x="376" dy="0">业务主体 -&gt; 核心资金主体</tspan><tspan x="376" dy="17">资金账户 / 信用账户</tspan><tspan x="376" dy="17">预算组 / Spend Rule 快照</tspan></text>
</g><g>
<rect x="650" y="150" width="220" height="100" rx="8" ry="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>

<text x="666" y="178" class="node-title">账目和周期选择</text>
<text x="666" y="202" class="node-text" text-anchor="start"><tspan x="666" dy="0">AVAILABLE / FROZEN</tspan><tspan x="666" dy="17">AUTHORIZATION / CLEARING</tspan><tspan x="666" dy="17">periodType + periodId</tspan></text>
</g><g>
<rect x="940" y="150" width="220" height="100" rx="8" ry="8" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1.5"/>

<text x="956" y="178" class="node-title">固化 route snapshot</text>
<text x="956" y="202" class="node-text" text-anchor="start"><tspan x="956" dy="0">参与方 / 规则版本</tspan><tspan x="956" dy="17">路径和金额组件</tspan><tspan x="956" dy="17">后续逆向优先回放</tspan></text>
</g><g>
<rect x="650" y="310" width="220" height="100" rx="8" ry="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>

<text x="666" y="338" class="node-title">生成 posting plan</text>
<text x="666" y="362" class="node-text" text-anchor="start"><tspan x="666" dy="0">借贷方向</tspan><tspan x="666" dy="17">金额平衡</tspan><tspan x="666" dy="17">账本 Profile 命中</tspan></text>
</g><g>
<rect x="940" y="310" width="220" height="100" rx="8" ry="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>

<text x="956" y="338" class="node-title">账本过账</text>
<text x="956" y="362" class="node-text" text-anchor="start"><tspan x="956" dy="0">LedgerTransaction</tspan><tspan x="956" dy="17">LedgerEntry</tspan><tspan x="956" dy="17">摘要和审计引用</tspan></text>
</g><g><line x1="280" y1="200" x2="360" y2="200" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/><rect x="290" y="179" width="60" height="22" rx="11" fill="#ffffff" opacity="0.96"/><text x="320" y="194" class="label" text-anchor="middle">当前路径</text></g><g><line x1="580" y1="200" x2="650" y2="200" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)"/><rect x="585" y="179" width="60" height="22" rx="11" fill="#ffffff" opacity="0.96"/><text x="615" y="194" class="label" text-anchor="middle">定位结果</text></g><g><line x1="870" y1="200" x2="940" y2="200" stroke="#9333ea" stroke-width="2" marker-end="url(#arrow-purple)"/><rect x="881" y="179" width="48" height="22" rx="11" fill="#ffffff" opacity="0.96"/><text x="905" y="194" class="label" text-anchor="middle">快照</text></g><g><path d="M 280 360 L 450 360 L 450 250 L 360 250" fill="none" stroke="#ea580c" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow-orange)"/><rect x="387" y="331" width="126" height="22" rx="11" fill="#ffffff" opacity="0.96"/><text x="450" y="346" class="label" text-anchor="middle">缺快照才进入人工解释</text></g><g><path d="M 1050 250 C 1050 290, 820 270, 760 310" fill="none" stroke="#9333ea" stroke-width="2" marker-end="url(#arrow-purple)"/><rect x="875" y="259" width="60" height="22" rx="11" fill="#ffffff" opacity="0.96"/><text x="905" y="274" class="label" text-anchor="middle">快照回放</text></g><g><line x1="870" y1="360" x2="940" y2="360" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)"/><rect x="869.5" y="339" width="71" height="22" rx="11" fill="#ffffff" opacity="0.96"/><text x="905" y="354" class="label" text-anchor="middle">平衡后入账</text></g><g><rect x="60" y="500" width="1100" height="110" rx="14" ry="14" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.5"/><text x="78" y="530" class="lane-title">路由层职责边界</text></g><text x="84" y="555" class="node-text" text-anchor="start"><tspan x="84" dy="0">路由只把已成立或已解释的资金事实翻译为账户、账目、账本周期和 posting plan；不判断业务订单是否成立，不解释 ACH return/NOC，不保存完整外部账户敏感信息，不直接写余额。</tspan></text><g transform="translate(60,660)"><rect x="-14" y="-18" width="247" height="116" rx="10" fill="#ffffff" stroke="#e5e7eb"/><line x1="0" y1="0" x2="34" y2="0" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/><text x="46" y="4" class="small">当前资金事实路由</text><line x1="0" y1="24" x2="34" y2="24" stroke="#9333ea" stroke-width="2" marker-end="url(#arrow-purple)"/><text x="46" y="28" class="small">快照固化和回放</text><line x1="0" y1="48" x2="34" y2="48" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)"/><text x="46" y="52" class="small">账务计划和过账</text><line x1="0" y1="72" x2="34" y2="72" stroke="#ea580c" stroke-width="2" marker-end="url(#arrow-orange)" stroke-dasharray="7 5"/><text x="46" y="76" class="small">人工解释 / 非主路径</text></g>
</svg>
