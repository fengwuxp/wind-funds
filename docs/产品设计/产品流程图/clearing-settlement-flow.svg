<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 810" width="1260" height="810" role="img" aria-label="清结算产品流程图">
<style>
text { font-family: 'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Microsoft JhengHei', 'SimHei', sans-serif; }
.title { font-size: 24px; font-weight: 700; fill: #111827; }
.subtitle { font-size: 13px; fill: #6b7280; }
.node-title { font-size: 15px; font-weight: 700; fill: #111827; }
.node-text { font-size: 12px; fill: #374151; }
.small { font-size: 11px; fill: #6b7280; }
.lane-title { font-size: 16px; font-weight: 700; fill: #111827; }
.label { font-size: 12px; fill: #6b7280; }
</style>
<defs><marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="strokeWidth"><polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/></marker><marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="strokeWidth"><polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/></marker><marker id="arrow-rose" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="strokeWidth"><polygon points="0 0, 10 3.5, 0 7" fill="#dc2626"/></marker><marker id="arrow-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="strokeWidth"><polygon points="0 0, 10 3.5, 0 7" fill="#9333ea"/></marker><marker id="arrow-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="strokeWidth"><polygon points="0 0, 10 3.5, 0 7" fill="#ea580c"/></marker><marker id="arrow-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="strokeWidth"><polygon points="0 0, 10 3.5, 0 7" fill="#6b7280"/></marker></defs>
<rect width="1260" height="810" fill="#ffffff"/>
<text x="40" y="46" class="title">清结算产品流程图</text>
<text x="40" y="72" class="subtitle">清分、清算、结算和出款是不同对象，只有批次确认和出款回单能推动对应资金状态</text>
<g>
<rect x="50" y="145" width="160" height="92" rx="8" ry="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>

<text x="66" y="173" class="node-title">交易明细</text>
<text x="66" y="197" class="node-text" text-anchor="start"><tspan x="66" dy="0">成功且已过账</tspan><tspan x="66" dy="17">命中 CLEARING</tspan></text>
</g><g>
<rect x="245" y="145" width="160" height="92" rx="8" ry="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>

<text x="261" y="173" class="node-title">清分前对账</text>
<text x="261" y="197" class="node-text" text-anchor="start"><tspan x="261" dy="0">业务 / 交易 / 账本</tspan><tspan x="261" dy="17">来源快照一致</tspan></text>
</g><g><polygon points="520,140 595,190 520,240 445,190" fill="#fffbeb" stroke="#fde68a" stroke-width="1.5"/><text x="520" y="186" class="node-title" text-anchor="middle">可清分准入?</text><text x="520" y="206" class="small" text-anchor="middle"><tspan x="520" dy="0">终态 / 金额 / 主体</tspan><tspan x="520" dy="15">异常原因可见</tspan></text></g><g>
<rect x="635" y="145" width="160" height="92" rx="8" ry="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>

<text x="651" y="173" class="node-title">清分批次确认</text>
<text x="651" y="197" class="node-text" text-anchor="start"><tspan x="651" dy="0">归类和规则快照</tspan><tspan x="651" dy="17">不直接入账</tspan></text>
</g><g>
<rect x="830" y="145" width="160" height="92" rx="8" ry="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>

<text x="846" y="173" class="node-title">清算候选</text>
<text x="846" y="197" class="node-text" text-anchor="start"><tspan x="846" dy="0">已确认明细</tspan><tspan x="846" dy="17">可排除 / 锁定</tspan></text>
</g><g>
<rect x="1025" y="145" width="160" height="92" rx="8" ry="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>

<text x="1041" y="173" class="node-title">清算批次确认</text>
<text x="1041" y="197" class="node-text" text-anchor="start"><tspan x="1041" dy="0">CLEARING -&gt; AVAILABLE</tspan><tspan x="1041" dy="17">重跑不重复清算</tspan></text>
</g><line x1="210" y1="190" x2="245" y2="190" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)"/><line x1="405" y1="190" x2="440" y2="190" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)"/><g><line x1="600" y1="190" x2="635" y2="190" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)"/><rect x="593.5" y="169" width="48" height="22" rx="11" fill="#ffffff" opacity="0.96"/><text x="617.5" y="184" class="label" text-anchor="middle">是</text></g><line x1="795" y1="190" x2="830" y2="190" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)"/><line x1="990" y1="190" x2="1025" y2="190" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)"/><g>
<rect x="440" y="275" width="170" height="70" rx="8" ry="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>

<text x="456" y="303" class="node-title">不可清分</text>
<text x="456" y="327" class="node-text" text-anchor="start"><tspan x="456" dy="0">记录原因</tspan><tspan x="456" dy="17">不进入批次</tspan></text>
</g><g><line x1="520" y1="240" x2="520" y2="275" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow-rose)"/><rect x="496" y="236.5" width="48" height="22" rx="11" fill="#ffffff" opacity="0.96"/><text x="520" y="251.5" class="label" text-anchor="middle">否</text></g><g>
<rect x="170" y="440" width="210" height="106" rx="8" ry="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>

<text x="186" y="468" class="node-title">结算单</text>
<text x="186" y="492" class="node-text" text-anchor="start"><tspan x="186" dy="0">净额 / 扣减项</tspan><tspan x="186" dy="17">准备金 / 追偿</tspan><tspan x="186" dy="17">AVAILABLE -&gt; SETTLEMENT</tspan></text>
</g><g>
<rect x="420" y="440" width="210" height="106" rx="8" ry="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>

<text x="436" y="468" class="node-title">出款前准入</text>
<text x="436" y="492" class="node-text" text-anchor="start"><tspan x="436" dy="0">账户 / 端点 / 通道</tspan><tspan x="436" dy="17">cutoff / 风控合规</tspan><tspan x="436" dy="17">外部规则 / 审批 / 对账</tspan></text>
</g><g>
<rect x="700" y="440" width="210" height="106" rx="8" ry="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>

<text x="716" y="468" class="node-title">出款单</text>
<text x="716" y="492" class="node-text" text-anchor="start"><tspan x="716" dy="0">提交 / 受理 / 处理中</tspan><tspan x="716" dy="17">等待回单或对账确认</tspan></text>
</g><g>
<rect x="960" y="440" width="210" height="106" rx="8" ry="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>

<text x="976" y="468" class="node-title">出款结果</text>
<text x="976" y="492" class="node-text" text-anchor="start"><tspan x="976" dy="0">成功关闭</tspan><tspan x="976" dy="17">失败回退一次</tspan><tspan x="976" dy="17">退回或金额不一致进差错</tspan></text>
</g><g><path d="M 1105 237 C 1110 360, 300 340, 275 440" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)"/><rect x="654.5" y="317.5" width="71" height="22" rx="11" fill="#ffffff" opacity="0.96"/><text x="690" y="332.5" class="label" text-anchor="middle">生成结算单</text></g><line x1="380" y1="493" x2="420" y2="493" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/><line x1="630" y1="493" x2="700" y2="493" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/><line x1="910" y1="493" x2="960" y2="493" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/><g><rect x="50" y="620" width="1150" height="92" rx="14" ry="14" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/><text x="68" y="650" class="lane-title">出款和清结算红线</text></g><text x="76" y="670" class="node-text" text-anchor="start"><tspan x="76" dy="0">支付成功不等于可结算；清分确认不入账；清算批次确认才触发 CLEARING -&gt; AVAILABLE；外部 submitted / accepted / processing 不等于到账成功；重大差错、外部规则未确认或审批缺失必须阻断出款。</tspan></text><g transform="translate(50,752)"><rect x="-14" y="-18" width="195" height="92" rx="10" fill="#ffffff" stroke="#e5e7eb"/><line x1="0" y1="0" x2="34" y2="0" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)"/><text x="46" y="4" class="small">清分清算主链路</text><line x1="0" y1="24" x2="34" y2="24" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/><text x="46" y="28" class="small">结算出款链路</text><line x1="0" y1="48" x2="34" y2="48" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow-rose)"/><text x="46" y="52" class="small">阻断和异常</text></g>
</svg>
