<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 860" width="1500" height="860" role="img" aria-label="直接交易产品流程图">
<style>
text{font-family:"Helvetica Neue",Helvetica,Arial,"PingFang SC","Microsoft YaHei","Microsoft JhengHei",SimHei,sans-serif;fill:#111827}
.title{font-size:24px;font-weight:700}.subtitle{font-size:13px;fill:#6b7280}.section-title{font-size:16px;font-weight:700}.node-title{font-size:14px;font-weight:700}.node-sub{font-size:12px;fill:#4b5563}.small{font-size:12px;fill:#6b7280}.label{font-size:12px;fill:#6b7280}
</style>
<defs><marker id="arrow-blue" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#2563eb"/></marker><marker id="arrow-green" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#16a34a"/></marker><marker id="arrow-rose" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#dc2626"/></marker><marker id="arrow-purple" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#9333ea"/></marker><marker id="arrow-orange" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#ea580c"/></marker><marker id="arrow-gray" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#64748b"/></marker><marker id="arrow-teal" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#0891b2"/></marker></defs>
<rect width="1500" height="860" fill="#ffffff"/>
<text x="56" y="55" class="title">直接交易产品流程图</text>
<text x="56" y="83" class="subtitle">内容对齐产品流程设计：补齐服务入口、转换、统一编排、生命周期、投影返回和失败分支。</text>
<g><rect x="40" y="118" width="1420" height="320" rx="14" fill="#f8fafc" stroke="#e5e7eb" stroke-width="1.5"/><text x="62" y="152" class="section-title">主流程：已确认资金事实进入交易层，账本过账成功后才返回成功</text><text x="62" y="174" class="small">补齐服务入口、请求转换、编排、生命周期和投影返回链路。</text></g><g><rect x="62" y="210" width="150" height="82" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/><text x="137" y="240" text-anchor="middle" class="node-title">调用方</text><text x="137" y="264" text-anchor="middle" class="node-sub"><tspan x="137" dy="0">topup / pay</tspan><tspan x="137" dy="18">transfer / refund</tspan></text></g><g><rect x="252" y="210" width="150" height="82" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/><text x="327" y="240" text-anchor="middle" class="node-title">服务入口</text><text x="327" y="264" text-anchor="middle" class="node-sub"><tspan x="327" dy="0">FundsDirect</tspan><tspan x="327" dy="18">TransactionService</tspan></text></g><g><rect x="442" y="210" width="150" height="82" rx="8" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/><text x="517" y="240" text-anchor="middle" class="node-title">请求转换</text><text x="517" y="264" text-anchor="middle" class="node-sub"><tspan x="517" dy="0">InstructionConverter</tspan><tspan x="517" dy="18">FundsInstructionSpec</tspan></text></g><g><rect x="632" y="210" width="150" height="82" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/><text x="707" y="240" text-anchor="middle" class="node-title">统一编排</text><text x="707" y="264" text-anchor="middle" class="node-sub"><tspan x="707" dy="0">Orchestrator</tspan><tspan x="707" dy="18">execute</tspan></text></g><g><rect x="822" y="210" width="150" height="82" rx="8" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/><text x="897" y="240" text-anchor="middle" class="node-title">路由解析</text><text x="897" y="264" text-anchor="middle" class="node-sub"><tspan x="897" dy="0">RouteResolver</tspan><tspan x="897" dy="18">ResolvedRouteSpec</tspan></text></g><g><rect x="1012" y="210" width="150" height="82" rx="8" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1.5"/><text x="1087" y="240" text-anchor="middle" class="node-title">生命周期</text><text x="1087" y="264" text-anchor="middle" class="node-sub"><tspan x="1087" dy="0">beforePosting</tspan><tspan x="1087" dy="18">交易事实 / 快照</tspan></text></g><g><rect x="1202" y="210" width="150" height="82" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/><text x="1277" y="240" text-anchor="middle" class="node-title">账本过账</text><text x="1277" y="264" text-anchor="middle" class="node-sub"><tspan x="1277" dy="0">PostingPlan</tspan><tspan x="1277" dy="18">LedgerEntry</tspan></text></g><g><line x1="212" y1="251" x2="252" y2="251" stroke="#2563eb" stroke-width="2.3" marker-end="url(#arrow-blue)"/></g><g><line x1="402" y1="251" x2="442" y2="251" stroke="#2563eb" stroke-width="2.3" marker-end="url(#arrow-blue)"/></g><g><line x1="592" y1="251" x2="632" y2="251" stroke="#2563eb" stroke-width="2.3" marker-end="url(#arrow-blue)"/></g><g><line x1="782" y1="251" x2="822" y2="251" stroke="#2563eb" stroke-width="2.3" marker-end="url(#arrow-blue)"/></g><g><line x1="972" y1="251" x2="1012" y2="251" stroke="#16a34a" stroke-width="2.3" marker-end="url(#arrow-green)"/></g><g><line x1="1162" y1="251" x2="1202" y2="251" stroke="#16a34a" stroke-width="2.3" marker-end="url(#arrow-green)"/></g><g><rect x="822" y="340" width="150" height="66" rx="8" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1.5"/><text x="897" y="370" text-anchor="middle" class="node-title">交易投影</text><text x="897" y="394" text-anchor="middle" class="node-sub"><tspan x="897" dy="0">账单 / 时间线</tspan></text></g><g><rect x="1202" y="340" width="150" height="66" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/><text x="1277" y="370" text-anchor="middle" class="node-title">余额投影</text><text x="1277" y="394" text-anchor="middle" class="node-sub"><tspan x="1277" dy="0">LedgerEntry 派生</tspan></text></g><g><rect x="632" y="340" width="150" height="66" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/><text x="707" y="370" text-anchor="middle" class="node-title">返回结果</text><text x="707" y="394" text-anchor="middle" class="node-sub"><tspan x="707" dy="0">交易流水号 / 状态</tspan></text></g><g><path d="M 1277 292 L 1277 373 L 972 373" fill="none" stroke="#9333ea" stroke-width="2.3" marker-end="url(#arrow-purple)"/><rect x="1092" y="350" width="66" height="22" rx="11" fill="#fff" opacity="0.96"/><text x="1125" y="365" text-anchor="middle" class="label">只读视图</text></g><g><line x1="1277" y1="292" x2="1277" y2="340" stroke="#16a34a" stroke-width="2.3" marker-end="url(#arrow-green)"/></g><g><path d="M 1202 373 L 1120 373 L 1120 426 L 782 426 L 782 373" fill="none" stroke="#9333ea" stroke-width="2.3" marker-end="url(#arrow-purple)"/><rect x="906" y="403" width="90" height="22" rx="11" fill="#fff" opacity="0.96"/><text x="951" y="418" text-anchor="middle" class="label">返回前可解释</text></g><g><rect x="40" y="475" width="1420" height="230" rx="14" fill="#f8fafc" stroke="#e5e7eb" stroke-width="1.5"/><text x="62" y="509" class="section-title">失败与幂等分支：失败不能留下账务副作用</text><text x="62" y="531" class="small">补齐幂等命中、路由失败、账本失败和原事实缺失，避免只画顺向路径。</text></g><g><polygon points="330,535 390,590 330,645 270,590" fill="#fffbeb" stroke="#fde68a" stroke-width="1.5"/><text x="330" y="585" text-anchor="middle" class="node-title">幂等?</text><text x="330" y="607" text-anchor="middle" class="node-sub"><tspan x="330" dy="0">业务键 + 摘要</tspan></text></g><g><rect x="62" y="550" width="150" height="78" rx="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/><text x="137" y="580" text-anchor="middle" class="node-title">摘要冲突</text><text x="137" y="604" text-anchor="middle" class="node-sub"><tspan x="137" dy="0">拒绝请求</tspan><tspan x="137" dy="18">无 route / entry</tspan></text></g><g><rect x="450" y="550" width="160" height="78" rx="8" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/><text x="530" y="580" text-anchor="middle" class="node-title">幂等命中</text><text x="530" y="604" text-anchor="middle" class="node-sub"><tspan x="530" dy="0">复用原交易事实</tspan><tspan x="530" dy="18">不重复入账</tspan></text></g><g><rect x="688" y="550" width="170" height="78" rx="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/><text x="773" y="580" text-anchor="middle" class="node-title">路由失败</text><text x="773" y="604" text-anchor="middle" class="node-sub"><tspan x="773" dy="0">主体 / 币种 / 账户</tspan><tspan x="773" dy="18">失败且无 posting</tspan></text></g><g><rect x="936" y="550" width="170" height="78" rx="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/><text x="1021" y="580" text-anchor="middle" class="node-title">账本失败</text><text x="1021" y="604" text-anchor="middle" class="node-sub"><tspan x="1021" dy="0">不展示成功</tspan><tspan x="1021" dy="18">markFailed / 告警</tspan></text></g><g><rect x="1184" y="550" width="190" height="78" rx="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/><text x="1279" y="580" text-anchor="middle" class="node-title">原事实缺失</text><text x="1279" y="604" text-anchor="middle" class="node-sub"><tspan x="1279" dy="0">退款 / 退费 / 冻结来源</tspan><tspan x="1279" dy="18">不得按当前绑定重路由</tspan></text></g><g><path d="M 330 292 L 330 450 L 330 535" fill="none" stroke="#64748b" stroke-width="2.3" stroke-dasharray="7 6" marker-end="url(#arrow-gray)"/><rect x="297" y="390.5" width="66" height="22" rx="11" fill="#fff" opacity="0.96"/><text x="330" y="405.5" text-anchor="middle" class="label">幂等检查</text></g><g><line x1="270" y1="590" x2="212" y2="590" stroke="#dc2626" stroke-width="2.3" marker-end="url(#arrow-rose)"/></g><g><line x1="390" y1="590" x2="450" y2="590" stroke="#2563eb" stroke-width="2.3" marker-end="url(#arrow-blue)"/></g><g><path d="M 897 292 L 897 318 L 585 318 L 585 515 L 773 515 L 773 550" fill="none" stroke="#dc2626" stroke-width="2.3" marker-end="url(#arrow-rose)"/></g><g><path d="M 1352 251 L 1408 251 L 1408 515 L 1021 515 L 1021 550" fill="none" stroke="#dc2626" stroke-width="2.3" marker-end="url(#arrow-rose)"/></g><g><path d="M 972 251 L 1128 251 L 1128 515 L 1279 515 L 1279 550" fill="none" stroke="#dc2626" stroke-width="2.3" marker-end="url(#arrow-rose)"/></g><g><rect x="40" y="745" width="1420" height="88" rx="14" fill="#f8fafc" stroke="#e5e7eb" stroke-width="1.5"/><text x="62" y="779" class="section-title">验收红线</text></g><text x="82" y="780" text-anchor="start" class="small"><tspan x="82" dy="0">1. 只承接已确认资金事实，不替代业务订单或外部通道状态机。</tspan><tspan x="82" dy="22">2. 本金、费用、成本、补贴、追偿和调账必须拆分表达。</tspan><tspan x="82" dy="22">3. 外部账户和支付工具只做引用，不作为内部账本主体。</tspan></text><g transform="translate(1060,772)"><rect x="-14" y="-18" width="310" height="120" rx="10" fill="#fff" stroke="#e5e7eb"/><line x1="0" y1="0" x2="34" y2="0" stroke="#2563eb" stroke-width="2.2" marker-end="url(#arrow-blue)"/><text x="46" y="4" class="small">服务入口和编排主链路</text><line x1="0" y1="24" x2="34" y2="24" stroke="#16a34a" stroke-width="2.2" marker-end="url(#arrow-green)"/><text x="46" y="28" class="small">账本过账和余额派生</text><line x1="0" y1="48" x2="34" y2="48" stroke="#9333ea" stroke-width="2.2" marker-end="url(#arrow-purple)"/><text x="46" y="52" class="small">只读投影和返回</text><line x1="0" y1="72" x2="34" y2="72" stroke="#dc2626" stroke-width="2.2" marker-end="url(#arrow-rose)" stroke-dasharray="7 6"/><text x="46" y="76" class="small">必须失败 / 无副作用</text></g>
</svg>
