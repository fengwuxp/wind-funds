<text x="40" y="46" class="title">wind-funds 产品总架构图</text>
<text x="40" y="72" class="subtitle">统一资金内核优先，业务场景通过 capability pack 接入，外部轨道只作为归一资金事实输入</text>
<g><rect x="36" y="96" width="1368" height="166" rx="14" ry="14" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1.5"/><text x="54" y="126" class="lane-title">P2 业务场景补充：场景交易 capability pack</text><text x="54" y="148" class="small">业务语义补充分册只提交归一资金事实、外部引用和核验状态，不改变统一资金内核</text></g><g><rect x="36" y="292" width="1368" height="188" rx="14" ry="14" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/><text x="54" y="322" class="lane-title">P1 资金交易入口和使用者读模型</text><text x="54" y="344" class="small">直接交易、授权交易、余额控制、路由和交易投影都必须建立在 P0 可证明事实之上</text></g><g><rect x="36" y="510" width="1368" height="232" rx="14" ry="14" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/><text x="54" y="540" class="lane-title">P0 统一资金内核和运营账务闭环</text><text x="54" y="562" class="small">钱包账户、账本账目、余额投影、对账清结算、归档重放优先保障，所有业务复用</text></g><g><rect x="36" y="772" width="1368" height="124" rx="14" ry="14" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.5" stroke-dasharray="8 6"/><text x="54" y="802" class="lane-title">外部轨道、报表和专业确认边界</text><text x="54" y="824" class="small">卡组织、ACH/Nacha、银行、PSP、跨境、FX、税务会计和持牌能力仅作引用或待确认</text></g><g>
