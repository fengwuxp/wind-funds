</g><g><rect x="40" y="670" width="330" height="250" rx="14" ry="14" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.5" stroke-dasharray="8 6"/><text x="58" y="700" class="lane-title">ACH 与银行转账外部轨道边界</text></g><g>
