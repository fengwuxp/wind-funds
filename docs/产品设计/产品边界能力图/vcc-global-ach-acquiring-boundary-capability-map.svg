</g><g><rect x="1050" y="120" width="370" height="245" rx="14" ry="14" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/><text x="1068" y="150" class="lane-title">全球账户收付款 capability pack</text></g><g>
