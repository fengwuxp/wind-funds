<text x="40" y="46" class="title">VCC / 全球账户 / ACH / 收单产品边界能力图</text>
<text x="40" y="72" class="subtitle">三类业务通过场景 pack 接入统一资金内核，ACH 仅作为外部轨道支持边界</text>
