<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 920" width="1500" height="920" role="img" aria-labelledby="title desc">
  <title id="title">对账、清分、清算、结算与出款系统流程</title>
  <desc id="desc">展示对账清算模块从来源事实和外部证据到对账、差错、清分、清算、结算、出款、追偿和重新对账的系统流程。</desc>
  <style>
    text { font-family: "Helvetica Neue", Helvetica, Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #111827; }
    .title { font-size: 28px; font-weight: 700; }
    .subtitle { font-size: 14px; fill: #6b7280; }
    .box { fill: #ffffff; stroke: #d1d5db; stroke-width: 1.5; rx: 10; ry: 10; }
    .orange { fill: #fff7ed; stroke: #fed7aa; }
    .green { fill: #f0fdf4; stroke: #bbf7d0; }
    .blue { fill: #eff6ff; stroke: #bfdbfe; }
    .purple { fill: #faf5ff; stroke: #e9d5ff; }
    .red { fill: #fef2f2; stroke: #fecaca; }
    .gray { fill: #f8fafc; stroke: #cbd5e1; }
    .label { font-size: 15px; font-weight: 700; }
    .sub { font-size: 12px; fill: #4b5563; }
    .section { font-size: 16px; font-weight: 700; fill: #374151; }
    .main { stroke: #ea580c; stroke-width: 2.7; fill: none; marker-end: url(#arrow-orange); }
    .fact { stroke: #2563eb; stroke-width: 2.3; fill: none; marker-end: url(#arrow-blue); }
    .ledger { stroke: #16a34a; stroke-width: 2.4; fill: none; marker-end: url(#arrow-green); }
    .risk { stroke: #dc2626; stroke-width: 2.3; fill: none; marker-end: url(#arrow-red); stroke-dasharray: 8 6; }
    .read { stroke: #9333ea; stroke-width: 2.2; fill: none; marker-end: url(#arrow-purple); }
  </style>
  <defs>
    <marker id="arrow-orange" markerWidth="12" markerHeight="8" refX="11" refY="4" orient="auto"><polygon points="0 0, 12 4, 0 8" fill="#ea580c"/></marker>
    <marker id="arrow-blue" markerWidth="12" markerHeight="8" refX="11" refY="4" orient="auto"><polygon points="0 0, 12 4, 0 8" fill="#2563eb"/></marker>
    <marker id="arrow-green" markerWidth="12" markerHeight="8" refX="11" refY="4" orient="auto"><polygon points="0 0, 12 4, 0 8" fill="#16a34a"/></marker>
    <marker id="arrow-red" markerWidth="12" markerHeight="8" refX="11" refY="4" orient="auto"><polygon points="0 0, 12 4, 0 8" fill="#dc2626"/></marker>
    <marker id="arrow-purple" markerWidth="12" markerHeight="8" refX="11" refY="4" orient="auto"><polygon points="0 0, 12 4, 0 8" fill="#9333ea"/></marker>
  </defs>
  <rect width="1500" height="920" fill="#ffffff"/>
  <text x="54" y="56" class="title">对账、清分、清算、结算与出款系统流程</text>
  <text x="54" y="84" class="subtitle">原则：先对账，后清分；先清账，后结算；外部受理不等于到账；差错只能追加事实或转人工闭环</text>

  <rect x="70" y="145" width="210" height="78" class="box blue"/>
  <text x="175" y="176" text-anchor="middle" class="label">来源事实</text>
  <text x="175" y="200" text-anchor="middle" class="sub">交易 / route / ledger entry</text>

  <rect x="70" y="270" width="210" height="78" class="box gray"/>
  <text x="175" y="301" text-anchor="middle" class="label">外部资金证据</text>
  <text x="175" y="325" text-anchor="middle" class="sub">通道文件 / 银行流水 / 回单</text>

  <rect x="360" y="205" width="190" height="86" class="box orange"/>
  <text x="455" y="235" text-anchor="middle" class="label">对账任务</text>
  <text x="455" y="259" text-anchor="middle" class="sub">范围 / 数据源 / 规则版本</text>
  <text x="455" y="277" text-anchor="middle" class="sub">重跑记录 / 审计</text>

  <rect x="620" y="205" width="190" height="86" class="box orange"/>
  <text x="715" y="235" text-anchor="middle" class="label">对账匹配</text>
  <text x="715" y="259" text-anchor="middle" class="sub">账实 / 账账 / 单账</text>
  <text x="715" y="277" text-anchor="middle" class="sub">余额一致性</text>

  <rect x="880" y="205" width="190" height="86" class="box red"/>
  <text x="975" y="235" text-anchor="middle" class="label">差错闭环</text>
  <text x="975" y="259" text-anchor="middle" class="sub">阻断 / 放行 / 审批</text>
  <text x="975" y="277" text-anchor="middle" class="sub">补事实 / 调账 / 核销</text>

  <rect x="1150" y="205" width="190" height="86" class="box orange"/>
  <text x="1245" y="235" text-anchor="middle" class="label">可清分明细</text>
  <text x="1245" y="259" text-anchor="middle" class="sub">成功且已过账</text>
  <text x="1245" y="277" text-anchor="middle" class="sub">完整快照和金额摘要</text>

  <rect x="250" y="460" width="190" height="86" class="box orange"/>
  <text x="345" y="490" text-anchor="middle" class="label">清分批次</text>
  <text x="345" y="514" text-anchor="middle" class="sub">只固化归类</text>
  <text x="345" y="532" text-anchor="middle" class="sub">不释放余额</text>

  <rect x="510" y="460" width="190" height="86" class="box orange"/>
  <text x="605" y="490" text-anchor="middle" class="label">清算候选</text>
  <text x="605" y="514" text-anchor="middle" class="sub">清算账期满足</text>
  <text x="605" y="532" text-anchor="middle" class="sub">前置对账放行</text>

  <rect x="770" y="460" width="190" height="86" class="box green"/>
  <text x="865" y="490" text-anchor="middle" class="label">清算批次确认</text>
  <text x="865" y="514" text-anchor="middle" class="sub">CLEARING 到 AVAILABLE</text>
  <text x="865" y="532" text-anchor="middle" class="sub">幂等只确认一次</text>

  <rect x="1030" y="460" width="190" height="86" class="box green"/>
  <text x="1125" y="490" text-anchor="middle" class="label">结算单锁定</text>
  <text x="1125" y="514" text-anchor="middle" class="sub">AVAILABLE 到 SETTLEMENT</text>
  <text x="1125" y="532" text-anchor="middle" class="sub">净额和扣减项可追溯</text>

  <rect x="1290" y="460" width="160" height="86" class="box green"/>
  <text x="1370" y="490" text-anchor="middle" class="label">出款单</text>
  <text x="1370" y="514" text-anchor="middle" class="sub">提交 / 在途</text>
  <text x="1370" y="532" text-anchor="middle" class="sub">成功 / 失败 / 差错</text>

  <rect x="510" y="690" width="220" height="88" class="box red"/>
  <text x="620" y="722" text-anchor="middle" class="label">追偿和人工处理</text>
  <text x="620" y="746" text-anchor="middle" class="sub">已出款后逆向不回滚</text>
  <text x="620" y="764" text-anchor="middle" class="sub">准备金 / 负余额 / 追偿单</text>

  <rect x="810" y="690" width="220" height="88" class="box purple"/>
  <text x="920" y="722" text-anchor="middle" class="label">重新对账和核销</text>
  <text x="920" y="746" text-anchor="middle" class="sub">差错关闭必须复核</text>
  <text x="920" y="764" text-anchor="middle" class="sub">处理动作和审计引用</text>

  <path d="M 280 184 C 305 190, 330 210, 360 235" class="fact"/>
  <path d="M 280 309 C 310 295, 335 270, 360 260" class="fact"/>
  <path d="M 550 248 L 620 248" class="main"/>
  <path d="M 810 248 L 880 248" class="main"/>
  <path d="M 1070 248 L 1150 248" class="main"/>
  <path d="M 1245 291 C 1180 380, 480 380, 345 460" class="main"/>
  <path d="M 440 503 L 510 503" class="main"/>
  <path d="M 700 503 L 770 503" class="ledger"/>
  <path d="M 960 503 L 1030 503" class="ledger"/>
  <path d="M 1220 503 L 1290 503" class="ledger"/>
  <path d="M 1370 546 C 1280 625, 1030 670, 920 690" class="read"/>
  <path d="M 975 291 C 900 420, 745 620, 620 690" class="risk"/>
  <path d="M 1370 546 C 1240 660, 770 655, 620 690" class="risk"/>
  <path d="M 920 690 C 860 610, 940 430, 975 291" class="risk"/>

  <text x="78" y="835" class="section">阻断规则</text>
  <text x="190" y="835" class="sub">重大差错不得带原因放行；外部 accepted、submitted、processing 不得展示为到账成功；差错处理不得直接修改历史分录或余额投影。</text>
</svg>
