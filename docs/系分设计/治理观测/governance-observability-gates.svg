<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 920" width="1500" height="920" role="img" aria-labelledby="title desc">
  <title id="title">治理、观测、安全与生产准入门禁</title>
  <desc id="desc">展示支付资金底座从设计基线、工程任务边界、Red、实现、验证、观测、安全审计到生产准入的门禁关系。</desc>
  <style>
    text { font-family: "Helvetica Neue", Helvetica, Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #111827; }
    .title { font-size: 28px; font-weight: 700; }
    .subtitle { font-size: 14px; fill: #6b7280; }
    .box { fill: #ffffff; stroke: #d1d5db; stroke-width: 1.5; rx: 10; ry: 10; }
    .blue { fill: #eff6ff; stroke: #bfdbfe; }
    .green { fill: #f0fdf4; stroke: #bbf7d0; }
    .purple { fill: #faf5ff; stroke: #e9d5ff; }
    .orange { fill: #fff7ed; stroke: #fed7aa; }
    .red { fill: #fef2f2; stroke: #fecaca; }
    .gray { fill: #f8fafc; stroke: #cbd5e1; }
    .label { font-size: 15px; font-weight: 700; }
    .sub { font-size: 12px; fill: #4b5563; }
    .section { font-size: 16px; font-weight: 700; fill: #374151; }
    .arrow { stroke: #2563eb; stroke-width: 2.5; fill: none; marker-end: url(#arrow-blue); }
    .ok { stroke: #16a34a; stroke-width: 2.5; fill: none; marker-end: url(#arrow-green); }
    .risk { stroke: #dc2626; stroke-width: 2.3; fill: none; marker-end: url(#arrow-red); stroke-dasharray: 8 6; }
    .ops { stroke: #ea580c; stroke-width: 2.4; fill: none; marker-end: url(#arrow-orange); }
  </style>
  <defs>
    <marker id="arrow-blue" markerWidth="12" markerHeight="8" refX="11" refY="4" orient="auto"><polygon points="0 0, 12 4, 0 8" fill="#2563eb"/></marker>
    <marker id="arrow-green" markerWidth="12" markerHeight="8" refX="11" refY="4" orient="auto"><polygon points="0 0, 12 4, 0 8" fill="#16a34a"/></marker>
    <marker id="arrow-red" markerWidth="12" markerHeight="8" refX="11" refY="4" orient="auto"><polygon points="0 0, 12 4, 0 8" fill="#dc2626"/></marker>
    <marker id="arrow-orange" markerWidth="12" markerHeight="8" refX="11" refY="4" orient="auto"><polygon points="0 0, 12 4, 0 8" fill="#ea580c"/></marker>
  </defs>
  <rect width="1500" height="920" fill="#ffffff"/>
  <text x="54" y="56" class="title">治理、观测、安全与生产准入门禁</text>
  <text x="54" y="84" class="subtitle">目的：把 PRD / DSL / 系分 / TDD 的设计结论转成可验证、可审计、可停止的工程交付链路</text>

  <rect x="80" y="145" width="220" height="82" class="box purple"/>
  <text x="190" y="176" text-anchor="middle" class="label">设计基线</text>
  <text x="190" y="200" text-anchor="middle" class="sub">PRD / DSL / 系分 / TDD</text>
  <text x="190" y="218" text-anchor="middle" class="sub">验收 ID / caseId / Red</text>

  <rect x="365" y="145" width="220" height="82" class="box blue"/>
  <text x="475" y="176" text-anchor="middle" class="label">工程任务边界</text>
  <text x="475" y="200" text-anchor="middle" class="sub">写入范围 / 禁止范围</text>
  <text x="475" y="218" text-anchor="middle" class="sub">验证命令 / 未覆盖范围</text>

  <rect x="650" y="145" width="220" height="82" class="box red"/>
  <text x="760" y="176" text-anchor="middle" class="label">Red</text>
  <text x="760" y="200" text-anchor="middle" class="sub">资金主线 / 清结算 / 治理红线</text>
  <text x="760" y="218" text-anchor="middle" class="sub">先失败再 Green</text>

  <rect x="935" y="145" width="220" height="82" class="box green"/>
  <text x="1045" y="176" text-anchor="middle" class="label">最小实现</text>
  <text x="1045" y="200" text-anchor="middle" class="sub">契约 / 服务 / DDL/H2</text>
  <text x="1045" y="218" text-anchor="middle" class="sub">只覆盖授权范围</text>

  <rect x="1220" y="145" width="220" height="82" class="box orange"/>
  <text x="1330" y="176" text-anchor="middle" class="label">验证和交付</text>
  <text x="1330" y="200" text-anchor="middle" class="sub">test / boundary / pmd</text>
  <text x="1330" y="218" text-anchor="middle" class="sub">diff check / 证据附件</text>

  <path d="M 300 186 L 365 186" class="arrow"/>
  <path d="M 585 186 L 650 186" class="arrow"/>
  <path d="M 870 186 L 935 186" class="arrow"/>
  <path d="M 1155 186 L 1220 186" class="ok"/>

  <rect x="90" y="330" width="300" height="118" class="box gray"/>
  <text x="240" y="361" text-anchor="middle" class="label">测试证据</text>
  <text x="240" y="388" text-anchor="middle" class="sub">契约测试 / 服务流程 / H2 schema</text>
  <text x="240" y="409" text-anchor="middle" class="sub">余额断言 / 幂等 / 并发</text>
  <text x="240" y="430" text-anchor="middle" class="sub">架构边界 / must-fail</text>

  <rect x="430" y="330" width="300" height="118" class="box gray"/>
  <text x="580" y="361" text-anchor="middle" class="label">观测证据</text>
  <text x="580" y="388" text-anchor="middle" class="sub">traceId / businessSn / batchSn</text>
  <text x="580" y="409" text-anchor="middle" class="sub">metric / alert / difference report</text>
  <text x="580" y="430" text-anchor="middle" class="sub">Runbook / 恢复验收</text>

  <rect x="770" y="330" width="300" height="118" class="box gray"/>
  <text x="920" y="361" text-anchor="middle" class="label">安全审计</text>
  <text x="920" y="388" text-anchor="middle" class="sub">权限 / 审批 / 职责分离</text>
  <text x="920" y="409" text-anchor="middle" class="sub">脱敏 / 水印 / 下载审计</text>
  <text x="920" y="430" text-anchor="middle" class="sub">操作者 / 前后值 / 凭证</text>

  <rect x="1110" y="330" width="300" height="118" class="box gray"/>
  <text x="1260" y="361" text-anchor="middle" class="label">外部规则</text>
  <text x="1260" y="388" text-anchor="middle" class="sub">来源 / 版本 / 生效日期</text>
  <text x="1260" y="409" text-anchor="middle" class="sub">法域 / 主体 / 核验日期</text>
  <text x="1260" y="430" text-anchor="middle" class="sub">确认方 / 确认状态</text>

  <path d="M 1330 227 C 1200 285, 420 285, 240 330" class="ops"/>
  <path d="M 1330 227 C 1260 290, 700 290, 580 330" class="ops"/>
  <path d="M 1330 227 C 1320 290, 1000 290, 920 330" class="ops"/>
  <path d="M 1330 227 L 1260 330" class="ops"/>

  <rect x="110" y="560" width="360" height="106" class="box red"/>
  <text x="290" y="592" text-anchor="middle" class="label">停止条件</text>
  <text x="290" y="617" text-anchor="middle" class="sub">授权越界 / 公共契约未授权 / schema 未授权</text>
  <text x="290" y="637" text-anchor="middle" class="sub">Red 未失败 / 外部规则未确认</text>
  <text x="290" y="657" text-anchor="middle" class="sub">验证失败且无法在授权范围内修复</text>

  <rect x="570" y="560" width="360" height="106" class="box green"/>
  <text x="750" y="592" text-anchor="middle" class="label">可交付证据</text>
  <text x="750" y="617" text-anchor="middle" class="sub">目标验证命令通过</text>
  <text x="750" y="637" text-anchor="middle" class="sub">资金断言、审计、Runbook 可追溯</text>
  <text x="750" y="657" text-anchor="middle" class="sub">未覆盖范围和残余风险明确</text>

  <rect x="1030" y="560" width="360" height="106" class="box orange"/>
  <text x="1210" y="592" text-anchor="middle" class="label">生产准入复核</text>
  <text x="1210" y="617" text-anchor="middle" class="sub">灰度 / 回滚 / 告警 / 容量</text>
  <text x="1210" y="637" text-anchor="middle" class="sub">财务、合规、通道、SRE 确认</text>
  <text x="1210" y="657" text-anchor="middle" class="sub">高危操作职责分离</text>

  <path d="M 240 448 L 290 560" class="risk"/>
  <path d="M 580 448 C 620 500, 680 530, 750 560" class="ok"/>
  <path d="M 920 448 C 930 510, 860 535, 750 560" class="ok"/>
  <path d="M 1260 448 L 1210 560" class="ops"/>
  <path d="M 470 613 L 570 613" class="ok"/>
  <path d="M 930 613 L 1030 613" class="ok"/>

  <text x="90" y="780" class="section">关键门禁关系</text>
  <text x="200" y="780" class="sub">1. 钱包账本余额、清结算对账、归档治理都必须先落 Red；Red 未证明失败前不进入 Green。</text>
  <text x="200" y="810" class="sub">2. 指标、投影、治理导出和大数据归档只读消费资金事实，不得反写交易、账本、清结算或余额。</text>
  <text x="200" y="840" class="sub">3. ACH、卡组织、银行、通道、跨境和持牌能力只做资金底座支撑边界，规则解释必须由业务专项或专业方确认。</text>
</svg>
